<!DOCTYPE html>
<!-- @dsCard group="Components" name="Popup & menu" subtitle="Dropdown menu + dialog" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-page);padding:20px 24px;display:flex;gap:18px;align-items:flex-start}
  /* dropdown menu */
  .menu{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:6px;width:208px}
  .mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);font-size:14px;color:var(--text-primary);font-weight:var(--fw-medium)}
  .mi svg{width:17px;height:17px;color:var(--text-tertiary)}
  .mi.hl{background:var(--gold-50)}
  .mi.hl svg{color:var(--gold-700)}
  .mi.danger{color:var(--text-error)}
  .mi.danger svg{color:var(--error)}
  .sep{height:1px;background:var(--border-subtle);margin:5px 2px}
  /* dialog */
  .dialog{background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);width:300px;overflow:hidden}
  .dhead{padding:20px 20px 0;display:flex;gap:12px;align-items:flex-start}
  .dico{width:40px;height:40px;border-radius:50%;background:var(--error-bg);display:flex;align-items:center;justify-content:center;flex:none}
  .dico svg{width:20px;height:20px;color:var(--error)}
  .dt{font-size:17px;font-weight:var(--fw-bold);color:var(--text-primary)}
  .dd{font-size:14px;color:var(--text-secondary);line-height:1.45;margin:4px 0 0}
  .dfoot{display:flex;gap:10px;padding:18px 20px 20px}
  .b{flex:1;border:none;border-radius:var(--radius-md);padding:10px;font-family:inherit;font-weight:var(--fw-semibold);font-size:14px;cursor:pointer}
  .b.cancel{background:var(--surface-sunken);color:var(--text-primary)}
  .b.confirm{background:var(--brand-red);color:#fff}
</style>
</head>
<body>
  <div class="menu">
    <div class="mi hl"><i data-lucide="eye"></i>Xem chi tiết</div>
    <div class="mi"><i data-lucide="copy"></i>Sao chép mã đơn</div>
    <div class="mi"><i data-lucide="download"></i>Tải hóa đơn</div>
    <div class="sep"></div>
    <div class="mi danger"><i data-lucide="trash-2"></i>Hủy đơn hàng</div>
  </div>
  <div class="dialog">
    <div class="dhead"><span class="dico"><i data-lucide="alert-triangle"></i></span><div><div class="dt">Hủy đơn hàng?</div><p class="dd">Đơn TX-48210 sẽ bị hủy và không thể khôi phục.</p></div></div>
    <div class="dfoot"><button class="b cancel">Quay lại</button><button class="b confirm">Hủy đơn</button></div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
