<!-- @dsCard group="Brand" name="Favicon" subtitle="App icon / favicon — spark mark, 16–64px + tab mock" viewport="700x150" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card);padding:24px;
       display:flex;align-items:center;gap:34px}
  .sizes{display:flex;align-items:flex-end;gap:22px}
  .it{display:flex;flex-direction:column;align-items:center;gap:9px}
  .it img{display:block;border-radius:22%}
  .px{font-size:11px;color:var(--text-tertiary);font-weight:var(--fw-semibold)}
  .divider{width:1px;align-self:stretch;background:var(--border-subtle)}
  /* browser tab mock */
  .tabwrap{flex:1}
  .tabbar{display:flex;align-items:flex-end;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-default);
       border-bottom:none;border-radius:10px 10px 0 0;padding:9px 14px;box-shadow:var(--shadow-xs);max-width:230px}
  .tab img{width:16px;height:16px;border-radius:4px;flex:none}
  .tab span{font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab.inactive{background:var(--surface-sunken);opacity:.7}
  .urlbar{height:34px;background:#fff;border:1px solid var(--border-default);border-radius:0 8px 8px 8px;
          display:flex;align-items:center;gap:9px;padding:0 14px;margin-top:-1px}
  .urlbar img{width:16px;height:16px}
  .urlbar .u{font-size:13px;color:var(--text-secondary)}
  /* app icon on home screen */
  .home{display:flex;flex-direction:column;align-items:center;gap:8px}
  .home img{width:62px;height:62px;border-radius:26%;box-shadow:var(--shadow-md)}
  .home .nm{font-size:12px;color:var(--text-secondary);font-weight:var(--fw-semibold)}
</style>
</head>
<body>
  <div class="sizes">
    <div class="it"><img src="../assets/favicon.svg" width="64" height="64"><span class="px">64</span></div>
    <div class="it"><img src="../assets/favicon.svg" width="48" height="48"><span class="px">48</span></div>
    <div class="it"><img src="../assets/favicon.svg" width="32" height="32"><span class="px">32</span></div>
    <div class="it"><img src="../assets/favicon.svg" width="16" height="16"><span class="px">16</span></div>
  </div>
  <div class="divider"></div>
  <div class="tabwrap">
    <div class="tabbar">
      <div class="tab"><img src="../assets/favicon.svg"><span>TIXIMAX — Mua hộ &amp; vận chuyển</span></div>
      <div class="tab inactive"><img src="../assets/favicon.svg"><span>Tra cứu đơn</span></div>
    </div>
    <div class="urlbar"><img src="../assets/favicon.svg"><span class="u">tiximax.com</span></div>
  </div>
  <div class="divider"></div>
  <div class="home"><img src="../assets/favicon.svg"><span class="nm">TIXIMAX</span></div>
</body>
</html>
