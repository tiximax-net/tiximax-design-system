<!-- @dsCard group="Components" name="Progress Components" subtitle="Basic, Steps, Timeline, Dashed, Curved, Vertical — airplane indicator" viewport="700x400" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:#fff;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:4px;line-height:130%}
  .card{background:var(--surface-page);border-radius:14px;border:1px solid var(--border-subtle);padding:20px 24px 14px}
  .hint{font-size:11px;color:var(--text-tertiary);text-align:right;margin-top:6px;line-height:130%}
  svg{overflow:visible;display:block}
</style>
</head>
<body>

<!-- Single defs SVG: airplane symbol + gradient -->
<svg style="display:none;position:absolute" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="px" viewBox="0 0 512 512">
      <path fill="currentColor" d="M 153.50 462.63 C147.73,459.99 143.99,454.09 144.01,447.68 C144.02,445.66 155.95,418.17 176.87,372.00 L 209.71 299.50 L 191.11 298.88 C180.87,298.54 159.16,297.95 142.87,297.57 L 113.23 296.89 L 94.40 319.69 C73.44,345.07 71.23,347.41 66.08,349.71 C62.17,351.46 35.99,352.78 29.47,351.56 C22.62,350.27 16.00,342.14 16.00,335.01 C16.00,333.32 20.77,314.82 26.61,293.89 L 37.22 255.83 L 26.50 217.22 C18.48,188.30 15.92,177.66 16.30,174.83 C17.05,169.19 20.47,164.43 25.54,161.98 C29.63,160.00 31.27,159.85 45.28,160.16 C60.24,160.49 60.69,160.57 67.29,163.82 C73.77,167.01 74.76,168.04 93.26,190.68 L 112.50 214.23 L 140.91 213.62 C156.54,213.28 178.25,213.00 189.16,213.00 C203.66,213.00 209.00,212.68 209.00,211.83 C209.00,211.18 194.32,178.30 176.38,138.76 C145.63,71.00 143.78,66.60 144.27,62.32 C144.82,57.43 146.99,53.84 151.39,50.56 C153.96,48.64 155.51,48.50 173.82,48.50 C192.30,48.50 193.76,48.64 197.70,50.74 C202.89,53.52 201.04,51.35 272.50,138.35 L 331.50 210.19 L 341.50 209.62 C366.30,208.20 416.87,207.79 428.00,208.93 C461.62,212.35 484.29,223.48 492.59,240.65 C495.04,245.71 495.42,247.72 495.46,255.50 C495.50,263.54 495.17,265.20 492.40,271.05 C485.09,286.47 468.36,296.40 440.74,301.72 C432.79,303.25 426.13,303.48 393.00,303.37 C371.83,303.30 349.33,302.95 343.00,302.59 L 331.50 301.93 L 267.19 379.96 C215.51,442.66 201.95,458.53 198.19,460.75 C193.58,463.45 193.18,463.50 175.00,463.75 C161.00,463.94 155.77,463.67 153.50,462.63 Z"/>
    </symbol>
  </defs>
</svg>

<div id="s0"></div>
<div id="s1"></div>
<div id="s2"></div>
<div id="s3"></div>
<div id="s4"></div>
<div id="s5"></div>
<div id="s6"></div>

<script>
const G='#F4B931', N='#264F91', TR='#DDE2EA', GR='#9AA5B5', DG='#EDF0F4', DS='#C3CBD7';
const MS=['Đặt hàng','Kho quốc tế','Vận chuyển','Kho VN','Giao hàng'];
const DT=['27/05','29/05','31/05','06/06','08/06'];
const W=660, XS=[40,185,330,475,620];
const cs=[2,2,2,2,2,3,0];
const animFrames={};

/* ─── airplane group (with .plane class for animation) ─── */
function pl(cx,cy,a,sz,col){
  sz=sz||26; col=col||G; const h=sz/2;
  return `<g class="plane" data-sz="${sz}" transform="translate(${cx},${cy}) rotate(${a||0}) translate(${-h},${-h})" style="color:${col};filter:drop-shadow(0 1px 7px rgba(244,185,49,.5))"><use href="#px" width="${sz}" height="${sz}"/></g>`;
}

/* ─── plane position lookup per section ─── */
function getPlanePos(id,step){
  if(id===0) return {x:XS[step],y:17,a:0,sz:26};
  if(id===1) return {x:XS[step],y:17,a:0,sz:26};
  if(id===2) return {x:XS[step],y:8,a:0,sz:22};
  if(id===3) return {x:XS[step],y:14,a:0,sz:24};
  if(id===4) return {x:XS[step],y:60,a:CTANGS[step],sz:28};
  if(id===5){const YS=[22,64,106,148,190];return {x:60,y:YS[step]-30,a:90,sz:26};}
  return {x:0,y:0,a:0,sz:22};
}

/* ─── ease-out cubic ─── */
function easeOut(t){ return 1-Math.pow(1-t,3); }

/* ─── animated glow ring ─── */
function glow(cx,cy,r){
  r=r||12;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${G}" opacity="0"><animate attributeName="opacity" values="0.22;0.04;0.22" dur="2s" repeatCount="indefinite"/><animate attributeName="r" values="${r};${r*1.65};${r}" dur="2s" repeatCount="indefinite"/></circle>`;
}

/* ─── milestone dot ─── */
function dot(cx,cy,state,r){
  r=r||9;
  if(state==='active'){
    return glow(cx,cy,r+4)+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${G}"/>`;
  }
  if(state==='completed'){
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${G}"/>`
      +`<polyline points="${cx-r*.42},${cy} ${cx-r*.06},${cy+r*.4} ${cx+r*.48},${cy-r*.36}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  if(state==='disabled'){
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${DG}" stroke="${DS}" stroke-width="1.5" stroke-dasharray="3,2"/>`;
  }
  // default
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${DS}" stroke-width="2"/>`;
}

/* ─── text helper ─── */
function tx(x,y,t,col,fw){
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="12" fill="${col||GR}" font-weight="${fw||400}" font-family="var(--font-sans)" style="line-height:130%">${t}</text>`;
}

/* ─── horizontal track lines ─── */
function trk(c,sy,dashed){
  let s='';
  for(let i=0;i<XS.length-1;i++){
    const done=i<c;
    const da=dashed?(done?'stroke-dasharray="9,5"':'stroke-dasharray="4,6"'):'';
    s+=`<line x1="${XS[i]}" y1="${sy}" x2="${XS[i+1]}" y2="${sy}" stroke="${done?G:TR}" stroke-width="3" stroke-linecap="round" ${da}/>`;
  }
  return s;
}

/* ─── section wrapper ─── */
function sec(id,label,inner,h,showHint){
  const hint=showHint===false?'':'<div class="hint">Nhấn vào mốc để cập nhật →</div>';
  document.getElementById('s'+id).innerHTML=
    `<div class="lbl">${label}</div>
     <div class="card"><svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" style="overflow:visible">${inner}</svg>${hint}</div>`;
}

/* ─── click targets ─── */
function clicks(sid,sy,disabledFrom){
  let s='';
  for(let i=0;i<XS.length;i++){
    if(disabledFrom!==undefined && i>=disabledFrom) continue;
    s+=`<circle cx="${XS[i]}" cy="${sy}" r="22" fill="transparent" style="cursor:pointer" onclick="setState(${sid},${i})"/>`;
  }
  return s;
}

function setState(id,v){
  const old=cs[id];
  if(old===v) return;
  const goingBack = v < old;
  cs[id]=v;
  // cancel any running animation for this section
  if(animFrames[id]) cancelAnimationFrame(animFrames[id]);
  // get old/new plane positions before re-render
  const from=getPlanePos(id,old);
  const to=getPlanePos(id,v);
  // For horizontal sections (0-4): flip 180° when going backward
  // For vertical section (5): flip to -90 (pointing up) when going backward
  if(id<=4){
    from.a = goingBack ? 180 + (from.a||0) : from.a;
    to.a   = goingBack ? 180 + (to.a||0)   : to.a;
  } else if(id===5){
    from.a = goingBack ? -90 : 90;
    to.a   = goingBack ? -90 : 90;
  }
  // re-render (dots, tracks, labels update instantly)
  render(id);
  // find the newly rendered plane element and animate it
  const svg=document.getElementById('s'+id).querySelector('svg');
  if(!svg) return;
  const plane=svg.querySelector('.plane');
  const conn=svg.querySelector('.conn');
  if(!plane) return;
  const sz=to.sz, h=sz/2;
  // hide connector during flight
  if(conn) conn.style.opacity='0';
  const duration=550;
  const start=performance.now();
  function tick(now){
    let t=Math.min((now-start)/duration,1);
    t=easeOut(t);
    const x=from.x+(to.x-from.x)*t;
    const y=from.y+(to.y-from.y)*t;
    const a=from.a+(to.a-from.a)*t;
    plane.setAttribute('transform',`translate(${x},${y}) rotate(${a}) translate(${-h},${-h})`);
    if(t<1){
      animFrames[id]=requestAnimationFrame(tick);
    } else {
      if(conn){conn.style.opacity='1';conn.style.transition='opacity .2s';}
      delete animFrames[id];
    }
  }
  animFrames[id]=requestAnimationFrame(tick);
}

function render(id){
  [rBasic,rSteps,rTimeline,rDashed,rCurved,rVertical,rStates][id]();
}

/* ═══════════════════════════════════════
   0 · HORIZONTAL — BASIC
═══════════════════════════════════════ */
function rBasic(){
  const c=cs[0],SY=52;
  let s=trk(c,SY);
  // dashed connector from plane bottom to dot top
  s+=`<line class="conn" x1="${XS[c]}" y1="31" x2="${XS[c]}" y2="43" stroke="${G}" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>`;
  s+=pl(XS[c],17,0,26);
  // dots
  for(let i=0;i<5;i++){
    const st=i<c?'completed':i===c?'active':'default';
    s+=dot(XS[i],SY,st);
  }
  // labels
  for(let i=0;i<5;i++){
    s+=tx(XS[i],78,MS[i],i===c?N:GR,i===c?600:400);
    s+=tx(XS[i],93,DT[i]);
  }
  s+=clicks(0,SY);
  sec(0,'HORIZONTAL — BASIC',s,100);
}

/* ═══════════════════════════════════════
   1 · HORIZONTAL — STEPS
═══════════════════════════════════════ */
function rSteps(){
  const c=cs[1],SY=54;
  let s=trk(c,SY);
  s+=`<line class="conn" x1="${XS[c]}" y1="31" x2="${XS[c]}" y2="41" stroke="${G}" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>`;
  s+=pl(XS[c],17,0,26);
  for(let i=0;i<5;i++){
    const st=i<c?'completed':i===c?'active':'default';
    const r=14, fill=(st==='completed'||st==='active')?G:'#fff', strk=(st==='completed'||st==='active')?G:DS;
    if(st==='active') s+=glow(XS[i],SY,r+5);
    s+=`<circle cx="${XS[i]}" cy="${SY}" r="${r}" fill="${fill}" stroke="${strk}" stroke-width="2.5"/>`;
    if(st==='completed'){
      s+=`<polyline points="${XS[i]-5},${SY} ${XS[i]-1},${SY+5} ${XS[i]+7},${SY-5}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    } else {
      s+=`<text x="${XS[i]}" y="${SY+5}" text-anchor="middle" font-size="13" fill="${st==='active'?'#fff':GR}" font-weight="700" font-family="var(--font-sans)" style="line-height:130%">${i+1}</text>`;
    }
    s+=tx(XS[i],88,MS[i],i===c?N:GR,i===c?600:400);
  }
  s+=clicks(1,SY);
  sec(1,'HORIZONTAL — STEPS',s,96);
}

/* ═══════════════════════════════════════
   2 · HORIZONTAL — TIMELINE (labeled steps)
═══════════════════════════════════════ */
function rTimeline(){
  const c=cs[2],SY=36;
  let s=trk(c,SY);
  s+=`<line class="conn" x1="${XS[c]}" y1="17" x2="${XS[c]}" y2="27" stroke="${G}" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>`;
  s+=pl(XS[c],8,0,22);
  for(let i=0;i<5;i++){
    const st=i<c?'completed':i===c?'active':'default';
    s+=dot(XS[i],SY,st,8);
    s+=tx(XS[i],60,MS[i],i===c?N:GR,i===c?600:400);
    // status tag
    let tag='',tagc=GR;
    if(i<c){tag='Hoàn thành';tagc=G;}
    else if(i===c){tag='Đang xử lý';tagc=G;}
    else {tag=DT[i];tagc=GR;}
    s+=tx(XS[i],75,tag,tagc,i===c?600:400);
  }
  s+=clicks(2,SY);
  sec(2,'HORIZONTAL — TIMELINE',s,84);
}

/* ═══════════════════════════════════════
   3 · HORIZONTAL — DASHED + DISABLED
═══════════════════════════════════════ */
function rDashed(){
  const c=cs[3],SY=46,DIS=4;
  let s='';
  for(let i=0;i<4;i++){
    const done=i<c, dis=i>=DIS||i+1>DIS;
    s+=`<line x1="${XS[i]}" y1="${SY}" x2="${XS[i+1]}" y2="${SY}" stroke="${dis?DS:done?G:TR}" stroke-width="2.5" stroke-dasharray="${done?'9,5':'4,6'}" stroke-linecap="round"/>`;
  }
  s+=`<line class="conn" x1="${XS[c]}" y1="27" x2="${XS[c]}" y2="39" stroke="${G}" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>`;
  s+=pl(XS[c],14,0,24);
  for(let i=0;i<5;i++){
    const dis=i>=DIS, st=dis?'disabled':i<c?'completed':i===c?'active':'default';
    s+=dot(XS[i],SY,st,7);
    s+=tx(XS[i],71,MS[i],dis?DS:i===c?N:GR,i===c?600:400);
  }
  s+=clicks(3,SY,DIS);
  sec(3,'HORIZONTAL — DASHED · includes disabled state',s,80);
}

/* ═══════════════════════════════════════
   4 · HORIZONTAL — CURVED / WAVE
   Pre-computed: milestones at segment endpoints (y=60),
   tangents analytically: [-45,+45,-45,+45,-45]°
═══════════════════════════════════════ */
const CRV=`M 40,60 C 85,15 140,15 185,60 C 230,105 285,105 330,60 C 375,15 430,15 475,60 C 520,105 575,105 620,60`;
const CSEGS=['M 40,60 C 85,15 140,15 185,60','M 185,60 C 230,105 285,105 330,60','M 330,60 C 375,15 430,15 475,60','M 475,60 C 520,105 575,105 620,60'];
const CTANGS=[-45,45,-45,45,-45];

function rCurved(){
  const c=cs[4];
  let s=`<path d="${CRV}" fill="none" stroke="${TR}" stroke-width="3" stroke-linecap="round"/>`;
  // completed segments in gold
  for(let i=0;i<c&&i<4;i++)
    s+=`<path d="${CSEGS[i]}" fill="none" stroke="${G}" stroke-width="3.5" stroke-linecap="round"/>`;
  // dots + plane + labels
  for(let i=0;i<5;i++){
    const x=XS[i],y=60,a=CTANGS[i],st=i<c?'completed':i===c?'active':'default';
    if(st==='active'){s+=glow(x,y,14);s+=pl(x,y,a,28);}
    else s+=dot(x,y,st,8);
    // labels alternate above (going-down tangent) / below (going-up tangent)
    s+=tx(x,a<0?y+32:y-18,MS[i],i===c?N:GR,i===c?600:400);
    s+=`<circle cx="${x}" cy="${y}" r="22" fill="transparent" style="cursor:pointer" onclick="setState(4,${i})"/>`;
  }
  sec(4,'HORIZONTAL — CURVED / WAVE · máy bay xoay theo hướng đường cong',s,128);
}

/* ═══════════════════════════════════════
   5 · VERTICAL — TIMELINE
═══════════════════════════════════════ */
function rVertical(){
  const c=cs[5];
  const TX=60, YS=[22,64,106,148,190], LX=84, svgH=215;
  let s='';
  // track
  for(let i=0;i<4;i++)
    s+=`<line x1="${TX}" y1="${YS[i]}" x2="${TX}" y2="${YS[i+1]}" stroke="${i<c?G:TR}" stroke-width="3" stroke-linecap="round"/>`;
  // plane above active dot, pointing DOWN (rotate 90)
  const py=YS[c]-30;
  s+=`<circle cx="${TX}" cy="${py}" r="17" fill="${G}" opacity="0.12"/>`;
  s+=pl(TX,py,90,26);
  s+=`<line class="conn" x1="${TX}" y1="${py+13}" x2="${TX}" y2="${YS[c]-10}" stroke="${G}" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>`;
  // dots + labels
  for(let i=0;i<5;i++){
    const st=i<c?'completed':i===c?'active':'default';
    s+=dot(TX,YS[i],st,9);
    const ac=i===c;
    s+=`<text x="${LX}" y="${YS[i]+12}" font-size="13" fill="${ac?N:GR}" font-weight="${ac?600:400}" font-family="var(--font-sans)" style="line-height:130%">${MS[i]}</text>`;
    s+=`<text x="${LX}" y="${YS[i]+29}" font-size="11" fill="${GR}" font-family="var(--font-sans)" style="line-height:130%">${DT[i]}</text>`;
    if(i<c)
      s+=`<text x="${W-8}" y="${YS[i]+12}" text-anchor="end" font-size="11" fill="${G}" font-weight="600" font-family="var(--font-sans)" style="line-height:130%">Hoàn thành ✓</text>`;
    else if(i===c)
      s+=`<text x="${W-8}" y="${YS[i]+12}" text-anchor="end" font-size="11" fill="${G}" font-weight="700" font-family="var(--font-sans)" style="line-height:130%">Đang xử lý ··</text>`;
    s+=`<circle cx="${TX}" cy="${YS[i]}" r="22" fill="transparent" style="cursor:pointer" onclick="setState(5,${i})"/>`;
  }
  sec(5,'VERTICAL — TIMELINE',s,svgH);
}

/* ═══════════════════════════════════════
   6 · STATES REFERENCE
═══════════════════════════════════════ */
function rStates(){
  const XP=[60,220,380,540], SY=48;
  const states=['completed','active','default','disabled'];
  const labels=['Completed','Active','Default','Disabled'];
  const descs=['Mốc đã hoàn thành','Mốc đang xử lý','Mốc chưa đến','Vô hiệu hóa'];
  let s='';
  // background track
  s+=`<line x1="${XP[0]}" y1="${SY}" x2="${XP[3]}" y2="${SY}" stroke="${TR}" stroke-width="2"/>`;
  s+=`<line x1="${XP[0]}" y1="${SY}" x2="${XP[1]}" y2="${SY}" stroke="${G}" stroke-width="2"/>`;
  // plane above 'active'
  s+=pl(XP[1],SY-28,0,22);
  s+=`<line x1="${XP[1]}" y1="${SY-17}" x2="${XP[1]}" y2="${SY-10}" stroke="${G}" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>`;
  // dots + labels on top of track
  for(let i=0;i<4;i++){
    s+=dot(XP[i],SY,states[i],12);
    s+=`<text x="${XP[i]}" y="${SY+36}" text-anchor="middle" font-size="13" fill="${N}" font-weight="600" font-family="var(--font-sans)" style="line-height:130%">${labels[i]}</text>`;
    s+=`<text x="${XP[i]}" y="${SY+53}" text-anchor="middle" font-size="11" fill="${GR}" font-family="var(--font-sans)" style="line-height:130%">${descs[i]}</text>`;
  }
  sec(6,'STATES REFERENCE',s,100,false);
}

// ── initial render ──
for(let i=0;i<7;i++) render(i);
</script>
</body>
</html>
