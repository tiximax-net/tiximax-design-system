<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiximax Express — Web app</title>
<!-- Favicon chuẩn DS: nền trắng cho tab tối, nền navy cho tab sáng (xem preview/brand-favicon.html) -->
<link rel="icon" type="image/svg+xml" href="../assets/favicon-light.svg" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* ============================================================
     TIXIMAX EXPRESS — web app (desktop)
     Nguồn: project claude.ai/design "Tiximax Express booking interface"
     (Tiximax Express.dc.html) — dựng lại bằng token của design system,
     không hardcode hex, nên chạy được cả light lẫn dark.
     4 khu: Booking wizard (3 bước) · My shipments · Tracking · Chat
     ============================================================ */

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font-body);
    background: var(--surface-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .view { animation: fadeUp 200ms ease-out; }
  [hidden] { display: none !important; }

  /* ---------- Header ---------- */
  .app-head {
    position: sticky; top: 0; z-index: 50;
    background: var(--surface-card); border-bottom: 1px solid var(--border-default);
  }
  .app-head__inner {
    max-width: 1080px; margin: 0 auto; padding: 0 var(--space-6);
    height: 64px; display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: var(--space-3); cursor: pointer; }
  .brand img { height: 30px; display: block; }
  [data-theme="dark"] .brand__logo--light, [data-theme="light"] .brand__logo--dark { display: none; }
  .brand__tag {
    font-family: var(--font-display); font-size: var(--fs-overline); font-weight: var(--fw-bold);
    letter-spacing: var(--ls-overline); text-transform: uppercase; color: var(--text-secondary);
    border-left: 1px solid var(--border-default); padding-left: var(--space-3);
  }
  .nav { display: flex; gap: var(--space-8); margin-left: auto; align-items: stretch; height: 64px; }
  .nav__btn {
    border: none; background: none; cursor: pointer; font: inherit;
    display: inline-flex; align-items: center; height: 64px; padding: 0 2px;
    font-size: var(--fs-body-sm); font-weight: var(--fw-medium); white-space: nowrap;
    color: var(--text-secondary); border-bottom: 2.5px solid transparent;
  }
  .nav__btn:hover { color: var(--text-primary); }
  .nav__btn.is-active { color: var(--text-primary); font-weight: var(--fw-bold); border-bottom-color: var(--brand-gold); }
  .nav__dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--brand-red); margin-left: 6px; }

  .tools { display: flex; align-items: center; gap: var(--space-2); }
  .tool {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--space-3);
    font: inherit; font-size: var(--fs-overline); font-weight: var(--fw-semibold);
    color: var(--text-secondary); background: var(--surface-card);
    border: 1px solid var(--border-default); border-radius: var(--radius-pill); cursor: pointer;
  }
  .tool:hover { border-color: var(--border-strong); color: var(--text-primary); }

  /* ---------- Layout ---------- */
  .main { max-width: 1080px; margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-16); }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-6); flex-wrap: wrap; margin-bottom: var(--space-6); }
  .h1 { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: var(--fw-bold); letter-spacing: var(--ls-tight); margin: 0 0 6px; }
  .lead { margin: 0; font-size: var(--fs-body-sm); color: var(--text-secondary); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-6); }
  .grid2--tight { gap: var(--space-5); align-items: start; }
  .col { display: flex; flex-direction: column; gap: var(--space-4); }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface-card); border: 1px solid var(--border-default);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-6);
  }
  .card--raised { box-shadow: var(--shadow-md); padding: var(--space-8); }
  .cap { font-size: var(--fs-overline); font-weight: var(--fw-bold); letter-spacing: var(--ls-overline); color: var(--text-brand); margin-bottom: var(--space-4); }
  .lbl { display: block; font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); letter-spacing: 0.01em; color: var(--text-secondary); margin-bottom: var(--space-2); }
  .lbl--gold { font-size: var(--fs-body-sm); color: var(--text-brand); }

  /* ---------- Stepper ---------- */
  .steps { display: flex; align-items: center; }
  .stp { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; background: none; border: 0; font: inherit; padding: 0; }
  .stp__circle {
    width: 26px; height: 26px; border-radius: var(--radius-pill); flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-overline); font-weight: var(--fw-bold);
    background: var(--surface-card); color: var(--text-tertiary); border: 1.5px solid var(--border-strong);
  }
  .stp.is-done .stp__circle { background: var(--brand-navy); color: var(--neutral-0); border: none; }
  .stp.is-cur .stp__circle { background: var(--brand-gold); color: var(--neutral-950); border: none; }
  .stp__label { font-size: var(--fs-caption); font-weight: var(--fw-medium); color: var(--text-tertiary); }
  .stp.is-cur .stp__label { font-weight: var(--fw-semibold); color: var(--text-primary); }
  .stp__line { width: 36px; height: 2px; background: var(--border-default); margin: 0 var(--space-3); }

  /* ---------- Field ---------- */
  .input, .textarea, .select {
    width: 100%; font: inherit; font-size: var(--fs-body-sm); color: var(--text-primary);
    background: var(--surface-card); border: 1.5px solid var(--border-default);
    border-radius: var(--radius-md); padding: 12px 14px; outline: none;
  }
  .textarea { resize: vertical; }
  .select { cursor: pointer; padding-right: var(--space-10); }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--brand-gold); box-shadow: var(--shadow-focus); }
  .input::placeholder, .textarea::placeholder { color: var(--text-tertiary); }
  .field-wrap { position: relative; }
  .field-wrap .lead-ic { position: absolute; left: 14px; top: 13px; color: var(--neutral-400); pointer-events: none; }
  .field-wrap .input { padding-left: 40px; }
  .unit { position: absolute; right: 14px; top: 13px; font-size: var(--fs-caption); font-weight: var(--fw-semibold); color: var(--text-tertiary); }
  /* Người gửi / người nhận: tên và SĐT xếp DỌC (một cột) — giữ là 1 ô subgrid */
  /* Tách rõ khối thông tin người gửi/nhận khỏi khối địa chỉ phía trên */
  .pair { display: grid; grid-template-columns: 1fr; gap: var(--space-4); margin-top: var(--space-4); }
  /* SĐT: ô chọn mã quốc gia (cờ + mã) đứng cạnh ô nhập số */
  .phone-field { display: flex; gap: var(--space-2); }
  .phone-cc { flex: none; width: 116px; padding-left: 12px; padding-right: var(--space-8); font-size: var(--fs-body-sm); }
  .phone-field .input { flex: 1; min-width: 0; }

  /* ---------- Address search ---------- */
  .party-h { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
  .party-h__ic { width: 24px; height: 24px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .party-h__ic--from { background: var(--gold-50); color: var(--text-brand); }
  .party-h__ic--to { background: var(--navy-50); color: var(--brand-navy); }
  .party-h__t { font-size: var(--fs-body); font-weight: var(--fw-semibold); }
  .party-h__t span { color: var(--text-tertiary); font-weight: var(--fw-regular); }

  .suggest {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; overflow: hidden;
    background: var(--surface-card); border: 1px solid var(--border-default);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  }
  .suggest__row {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    padding: 11px 14px; font: inherit; font-size: var(--fs-caption); color: var(--text-secondary);
    background: none; border: 0; cursor: pointer;
  }
  .suggest__row:hover { background: var(--navy-50); color: var(--text-primary); }
  .suggest__row .ic { color: var(--text-brand); flex: none; margin-top: 1px; }

  .recents { display: flex; flex-direction: column; gap: 6px; }
  .recent {
    display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
    padding: 10px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md);
    background: var(--surface-sunken); font: inherit; font-size: var(--fs-caption); color: var(--text-secondary); cursor: pointer;
  }
  .recent:hover { border-color: var(--brand-gold); background: var(--gold-50); }
  .recent span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Hai cột người gửi / người nhận ----------
     Địa chỉ dài ngắn khác nhau (1 dòng ↔ 2 dòng) làm mọi thứ bên dưới lệch theo.
     Cho hai cột dùng CHUNG hàng bằng subgrid: mỗi phần (tiêu đề · địa chỉ · tên+SĐT
     · ghi chú) là một hàng, chiều cao lấy theo cột cao hơn nên luôn thẳng hàng. */
  .parties { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); column-gap: var(--space-6); row-gap: var(--space-5); }
  .party { display: grid; grid-template-rows: subgrid; grid-row: span 5; align-content: start; }
  .addr-slot { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
  @supports not (grid-template-rows: subgrid) {
    /* Dự phòng cho trình duyệt chưa có subgrid: chốt cứng chiều cao ô địa chỉ */
    .party { display: flex; flex-direction: column; gap: var(--space-5); }
    .addr-slot { min-height: 190px; }
  }

  .addr-picked {
    display: flex; gap: var(--space-3); align-items: flex-start;
    /* 2 dòng địa chỉ + padding + viền — để ô 1 dòng và ô 2 dòng cao bằng nhau */
    min-height: 70px;
    padding: 14px 16px; border: 1.5px solid var(--brand-gold); border-radius: var(--radius-lg); background: var(--gold-50);
  }
  .addr-picked__t { flex: 1; font-size: var(--fs-caption); color: var(--neutral-900); line-height: var(--lh-normal); }
  .link-btn { border: none; background: none; color: var(--text-link); font: inherit; font-size: var(--fs-caption); font-weight: var(--fw-semibold); cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  /* Ô mã bưu điện — vẫn cho khách nhập tay dù đã chọn địa chỉ autocomplete */
  .lbl-opt { font-size: var(--fs-overline); font-weight: var(--fw-semibold); letter-spacing: 0; color: var(--text-tertiary); text-transform: none; margin-left: 6px; }

  /* ---------- Address picker — dropdown gọn, xổ xuống ngay dưới ô ---------- */
  .addr-anchor { position: relative; }
  .addr-drop {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    display: flex; flex-direction: column; overflow: hidden; max-height: 320px;
    background: var(--surface-card); border: 1px solid var(--border-default);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); animation: fadeUp 120ms ease-out;
  }
  .addr-drop__cap { padding: 10px 12px 4px; font-size: var(--fs-overline); font-weight: var(--fw-bold); letter-spacing: var(--ls-overline); text-transform: uppercase; color: var(--text-tertiary); }
  .addr-drop__list { overflow-y: auto; padding: 4px 6px 6px; display: flex; flex-direction: column; gap: 2px; }
  .picker__empty { padding: 16px 12px; text-align: center; font-size: var(--fs-caption); color: var(--text-tertiary); }
  .pick-row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border: none; background: none; border-radius: var(--radius-md); cursor: pointer; font: inherit;
  }
  .pick-row:hover { background: var(--navy-50); }
  .pick-row__ic {
    width: 32px; height: 32px; flex: none; border-radius: var(--radius-pill);
    background: var(--brand-navy); color: var(--neutral-0); display: flex; align-items: center; justify-content: center;
  }
  .pick-row--exact .pick-row__ic { background: var(--gold-50); color: var(--text-brand); }
  .pick-row__body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pick-row__t { font-size: var(--fs-caption); font-weight: var(--fw-semibold); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick-row__m { font-size: var(--fs-overline); color: var(--text-secondary); line-height: var(--lh-normal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick-row__m b { color: var(--text-primary); font-weight: var(--fw-semibold); }

  [data-theme="dark"] .ptab.is-active { background: rgba(244, 185, 49, .12); color: var(--brand-gold); }
  [data-theme="dark"] .pick-row:hover { background: var(--surface-sunken); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    font: inherit; font-size: var(--fs-body-sm); font-weight: var(--fw-bold);
    padding: 13px 28px; border: none; border-radius: var(--radius-md); cursor: pointer;
  }
  .btn--primary { background: var(--brand-gold); color: var(--neutral-950); box-shadow: var(--shadow-gold); }
  .btn--primary:hover { background: var(--gold-600); }
  .btn--primary:active { transform: scale(.98); }
  .btn--primary:disabled { background: var(--surface-sunken); color: var(--text-disabled); box-shadow: none; cursor: not-allowed; transform: none; }
  .btn--ghost {
    background: var(--surface-card); color: var(--text-secondary);
    border: 1.5px solid var(--border-default); font-weight: var(--fw-semibold); padding: 12px 24px;
  }
  .btn--ghost:hover { border-color: var(--neutral-400); color: var(--text-primary); }
  .btn--outline {
    background: var(--surface-card); color: var(--brand-primary);
    border: 1.5px solid var(--brand-primary); font-weight: var(--fw-semibold); padding: 11px 20px; font-size: var(--fs-caption);
  }
  .btn--outline:hover { background: var(--navy-50); }
  .btn--dashed {
    width: 100%; padding: 14px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-lg);
    background: none; color: var(--brand-primary); font-weight: var(--fw-semibold);
  }
  .btn--dashed:hover { border-color: var(--brand-primary); background: var(--navy-50); }
  .row-btns { display: flex; justify-content: space-between; gap: var(--space-3); }

  /* ---------- Items (step 2) ---------- */
  .item-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: 18px; }
  .item-num {
    width: 28px; height: 28px; border-radius: var(--radius-pill); flex: none;
    background: var(--brand-navy); color: var(--neutral-0);
    display: flex; align-items: center; justify-content: center; font-size: var(--fs-caption); font-weight: var(--fw-bold);
  }
  .item-title { font-size: var(--fs-body); font-weight: var(--fw-semibold); flex: 1; }
  .icon-btn { border: none; background: none; color: var(--neutral-400); cursor: pointer; padding: 6px; border-radius: var(--radius-sm); display: flex; }
  .icon-btn:hover { color: var(--brand-red); background: var(--error-bg); }
  .photos { display: flex; gap: 10px; flex-wrap: wrap; }
  .photo { position: relative; width: 84px; height: 84px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-default); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo__x {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; padding: 0;
    border-radius: var(--radius-pill); border: none; cursor: pointer;
    background: rgba(12, 26, 49, .65); color: var(--neutral-0);
    display: flex; align-items: center; justify-content: center;
  }
  .photo__x:hover { background: var(--neutral-950); }
  .photo-add {
    width: 84px; height: 84px; border-radius: var(--radius-md);
    border: 1.5px dashed var(--border-strong); background: var(--surface-sunken);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; color: var(--text-secondary); font-size: var(--fs-overline); font-weight: var(--fw-semibold);
  }
  .photo-add:hover { border-color: var(--brand-gold); color: var(--text-brand); background: var(--gold-50); }
  .note { margin: 10px 0 0; font-size: var(--fs-caption); color: var(--text-secondary); line-height: var(--lh-normal); }

  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: var(--radius-pill);
    font: inherit; font-size: var(--fs-caption); font-weight: var(--fw-semibold); cursor: pointer;
    border: 1.5px solid var(--border-default); background: var(--surface-card); color: var(--text-secondary);
  }
  .chip[aria-pressed="true"] { border-color: var(--brand-gold); background: var(--gold-50); color: var(--gold-700); }

  /* ---------- Route rail (review + tracking) ---------- */
  .rail { display: flex; gap: 14px; }
  .rail__line { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .rail__dot { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--brand-gold); }
  .rail__dot--end { background: var(--surface-card); border: 2.5px solid var(--brand-navy); }
  .rail__bar { width: 2px; flex: 1; background: var(--border-default); margin: 4px 0; }
  .rail__body { display: flex; flex-direction: column; gap: var(--space-4); flex: 1; min-width: 0; }
  .rail__who { font-size: var(--fs-caption); font-weight: var(--fw-semibold); }
  .rail__addr { font-size: var(--fs-caption); color: var(--text-secondary); line-height: var(--lh-normal); }
  .rail__cap { font-size: var(--fs-overline); font-weight: var(--fw-bold); letter-spacing: var(--ls-overline); color: var(--text-tertiary); margin-bottom: 3px; }

  .thumb {
    width: 44px; height: 44px; border-radius: var(--radius-md); overflow: hidden; flex: none;
    border: 1px solid var(--border-default); background: var(--surface-page); color: var(--neutral-400);
    display: flex; align-items: center; justify-content: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .li { display: flex; gap: var(--space-3); align-items: center; }
  .li__t { font-size: var(--fs-caption); font-weight: var(--fw-semibold); }
  .li__m { font-size: var(--fs-overline); color: var(--text-secondary); }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .split { display: flex; justify-content: space-between; font-size: var(--fs-caption); color: var(--text-secondary); }
  .divide { border-top: 1px solid var(--border-subtle); margin-top: var(--space-4); padding-top: 14px; display: flex; flex-direction: column; gap: var(--space-2); }

  /* ---------- Estimate ---------- */
  .estimate { background: var(--surface-navy); color: var(--neutral-0); border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-lg); }
  .estimate .cap { color: var(--navy-200); }
  .estimate__line { display: flex; justify-content: space-between; font-size: var(--fs-caption); color: var(--navy-100); }
  .estimate__total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid rgba(255,255,255,.18); padding-top: 14px; margin-top: 14px; }
  .estimate__total b { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: var(--fw-bold); color: var(--gold-300); }
  .estimate p { margin: 12px 0 0; font-size: var(--fs-overline); color: var(--navy-200); line-height: var(--lh-relaxed); }
  .info-note {
    background: var(--info-bg); border: 1px solid var(--info-border); border-radius: var(--radius-md);
    padding: 14px 16px; font-size: var(--fs-caption); color: var(--text-info); line-height: var(--lh-relaxed);
  }

  /* ---------- Đơn giá / kg (nêu rõ, dễ nhìn) ---------- */
  .rate-box { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); border-radius: var(--radius-md); padding: 13px 16px; }
  .rate-box .k { font-size: var(--fs-overline); font-weight: var(--fw-bold); letter-spacing: var(--ls-overline); text-transform: uppercase; display: block; margin-bottom: 3px; }
  .rate-box .v { font-family: var(--font-display); font-size: var(--fs-h4); font-weight: var(--fw-bold); line-height: 1; }
  .rate-box .v small { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); }
  .rate-box .w { text-align: right; flex: none; }
  .rate-box .w b { font-family: var(--font-display); font-size: var(--fs-h4); font-weight: var(--fw-bold); line-height: 1; display: block; }
  .rate-box .w span { font-size: var(--fs-overline); }
  /* Trên card ước tính (nền navy) */
  .estimate .rate-box { background: rgba(244, 185, 49, .14); border: 1px solid rgba(244, 185, 49, .30); margin-bottom: var(--space-4); }
  .estimate .rate-box .k { color: var(--navy-100); }
  .estimate .rate-box .v { color: var(--gold-300); }
  .estimate .rate-box .v small { color: var(--navy-100); }
  .estimate .rate-box .w b { color: var(--neutral-0); }
  .estimate .rate-box .w span { color: var(--navy-200); }
  /* Trên card sáng (tracking) */
  .rate-box--light { background: var(--gold-50); border: 1px solid var(--gold-200); margin-bottom: var(--space-3); }
  .rate-box--light .k { color: var(--text-tertiary); }
  .rate-box--light .v { color: var(--text-brand); }
  .rate-box--light .v small { color: var(--text-secondary); }
  .rate-box--light .w b { color: var(--text-primary); }
  .rate-box--light .w span { color: var(--text-tertiary); }
  [data-theme="dark"] .rate-box--light { background: rgba(244, 185, 49, .10); border-color: rgba(244, 185, 49, .22); }

  /* Nhắc đơn giá ngay cạnh ô nhập cân */
  .rate-hint { color: var(--text-brand); font-weight: var(--fw-bold); }

  /* ---------- Done ---------- */
  .done { max-width: 520px; margin: 48px auto 0; text-align: center; padding: 48px 40px; }
  .done__ic {
    width: 64px; height: 64px; border-radius: var(--radius-pill); margin: 0 auto var(--space-5);
    background: var(--success-bg); color: var(--text-success); display: flex; align-items: center; justify-content: center;
  }
  .done h2 { font-family: var(--font-display); margin: 0 0 var(--space-2); font-size: var(--fs-h4); font-weight: var(--fw-bold); }
  .done p { margin: 0 0 28px; font-size: var(--fs-body-sm); color: var(--text-secondary); line-height: var(--lh-relaxed); }

  /* ---------- Orders ---------- */
  .order {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; width: 100%; text-align: left;
    background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-md);
    box-shadow: var(--shadow-xs); padding: 12px 18px; cursor: pointer; font: inherit;
    /* <button> mặc định color:buttontext (đen) — không kế thừa, dark mode sẽ đen trên nền tối */
    color: var(--text-primary);
    transition: box-shadow 150ms ease-out, transform 150ms ease-out;
  }
  .order:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .order__ic {
    width: 32px; height: 32px; border-radius: var(--radius-sm); flex: none;
    background: var(--navy-50); color: var(--brand-navy); display: flex; align-items: center; justify-content: center;
  }
  .order__id { font-size: var(--fs-caption); font-weight: var(--fw-semibold); }
  .order__sub { font-size: var(--fs-overline); color: var(--text-tertiary); }
  .order__route { flex: 1; min-width: 170px; display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-caption); color: var(--text-secondary); }
  .order__price { font-size: var(--fs-caption); font-weight: var(--fw-semibold); min-width: 64px; text-align: right; }
  .order__bar { width: 70px; flex: none; height: 4px; border-radius: var(--radius-pill); background: var(--surface-sunken); overflow: hidden; }
  .order__bar i { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--brand-gold); transition: width 200ms ease-out; }
  .order__bar i.is-done { background: var(--brand-green); }

  .badge { padding: 6px 14px; border-radius: var(--radius-pill); font-size: var(--fs-overline); font-weight: var(--fw-semibold); white-space: nowrap; }
  .badge--green { background: var(--success-bg); color: var(--text-success); }
  .badge--blue { background: var(--info-bg); color: var(--text-info); }
  .badge--gold { background: var(--gold-50); color: var(--gold-700); }
  .badge--grey { background: var(--surface-sunken); color: var(--text-secondary); }

  /* ---------- Tracking ---------- */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; border: none; background: none;
    font: inherit; font-size: var(--fs-caption); font-weight: var(--fw-semibold);
    color: var(--text-secondary); cursor: pointer; padding: 0; margin-bottom: var(--space-4);
  }
  .back-link:hover { color: var(--brand-primary); }
  .tl { display: flex; gap: var(--space-4); }
  .tl__gut { display: flex; flex-direction: column; align-items: center; }
  .tl__dot {
    width: 24px; height: 24px; border-radius: var(--radius-pill); flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-card); border: 2px solid var(--border-default); color: var(--neutral-0);
  }
  .tl__dot.is-done { background: var(--brand-navy); border: none; }
  .tl__dot.is-cur { background: var(--brand-gold); border: none; box-shadow: 0 0 0 4px rgba(244, 185, 49, .25); }
  .tl__dot img { width: 14px; height: 14px; display: block; }
  .tl__line { width: 2px; flex: 1; min-height: 20px; background: var(--border-default); }
  .tl__line.is-done { background: var(--brand-navy); }
  .tl__body { padding-bottom: var(--space-6); }
  .tl__label { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--text-tertiary); line-height: 24px; }
  .tl__label.is-on { font-weight: var(--fw-semibold); color: var(--text-primary); }
  .tl__time { font-size: var(--fs-overline); color: var(--text-tertiary); margin-top: 2px; }
  .pickup-note { margin-top: var(--space-4); padding: 10px 14px; background: var(--surface-page); border-radius: var(--radius-md); font-size: var(--fs-caption); color: var(--text-secondary); line-height: var(--lh-normal); }

  /* ---------- Chat ---------- */
  .chat {
    display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 520px; overflow: hidden;
    background: var(--surface-card); border: 1px solid var(--border-default);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
  }
  .chat__head { display: flex; align-items: center; gap: var(--space-3); padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); background: var(--surface-sunken); }
  /* Avatar Chat = logo Symbol tròn màu Navy (SVG đã có sẵn hình tròn nền navy) */
  .chat__avatar { position: relative; width: 40px; height: 40px; flex: none; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; }
  .chat__avatar img { width: 100%; height: 100%; display: block; border-radius: var(--radius-pill); }
  [data-theme="dark"] .chat__avatar--light, [data-theme="light"] .chat__avatar--dark { display: none; }
  .chat__avatar i { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: var(--radius-pill); background: var(--green-400); border: 2px solid var(--surface-sunken); }
  .chat__name { font-size: var(--fs-body); font-weight: var(--fw-bold); }
  .chat__status { font-size: var(--fs-overline); color: var(--text-success); display: flex; align-items: center; gap: 5px; }
  .chat__status i { width: 7px; height: 7px; border-radius: var(--radius-pill); background: currentColor; }
  .chat__body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: var(--space-3); background: var(--surface-page); }

  .sysmsg { align-self: center; background: var(--surface-sunken); color: var(--text-secondary); font-size: var(--fs-overline); font-weight: var(--fw-semibold); padding: 5px 12px; border-radius: var(--radius-pill); }
  .msg-row { display: flex; }
  .msg-row--me { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 8px; display: flex; flex-direction: column; gap: 6px;
    border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) var(--radius-xs); background: var(--surface-card);
    border: 1px solid var(--border-default); color: var(--text-primary); box-shadow: var(--shadow-xs);
  }
  /* Tin mình gửi = NỀN VÀNG, chữ navy — giống ChatMessage side="out" của DS
     (src/components/Chat.tsx) và .msg-out của prototype điện thoại. */
  .bubble--me { border-radius: var(--radius-lg) var(--radius-lg) var(--radius-xs) var(--radius-lg); background: var(--brand-gold); color: var(--navy-900); border: none; box-shadow: none; }
  .bubble__t { font-size: var(--fs-caption); line-height: var(--lh-normal); padding: 3px 6px 0; }
  .bubble__time { font-size: var(--fs-overline); color: var(--text-tertiary); text-align: right; padding: 0 6px 2px; }
  .bubble--me .bubble__time { color: var(--navy-700); }
  .att-img { width: 180px; max-width: 100%; height: 140px; border-radius: var(--radius-md); object-fit: cover; display: block; }
  .att-file { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface-page); border: 1px solid var(--border-default); }
  /* Trên nền vàng thì phủ sắc navy mờ, không phủ trắng — trắng trên vàng gần như mất hình. */
  .bubble--me .att-file { background: rgba(11, 23, 46, .10); border: none; }
  .att-file__ic {
    width: 32px; height: 32px; border-radius: var(--radius-sm); flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: var(--fw-bold); background: var(--brand-navy); color: var(--neutral-0);
  }
  .att-file__n { font-size: var(--fs-caption); font-weight: var(--fw-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .att-file__s { font-size: var(--fs-overline); color: var(--text-tertiary); }
  .bubble--me .att-file__n { color: var(--navy-900); }
  .bubble--me .att-file__s { color: var(--navy-700); }

  .pending { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 16px 0; background: var(--surface-card); }
  .pending__item { position: relative; }
  .pending__img { width: 56px; height: 56px; border-radius: var(--radius-sm); object-fit: cover; display: block; }
  .pending__file { display: flex; align-items: center; gap: var(--space-2); height: 56px; padding: 0 14px 0 10px; border-radius: var(--radius-sm); background: var(--surface-page); border: 1px solid var(--border-default); }
  .pending__x {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; padding: 0;
    border-radius: var(--radius-pill); border: none; cursor: pointer;
    background: var(--neutral-950); color: var(--neutral-0); display: flex; align-items: center; justify-content: center;
  }
  .composer { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border-subtle); background: var(--surface-card); }
  .composer__attach {
    width: 44px; height: 44px; flex: none; border-radius: var(--radius-pill);
    border: 1.5px solid var(--border-default); background: var(--surface-card); color: var(--brand-primary);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .composer__attach:hover { border-color: var(--brand-primary); background: var(--navy-50); }
  .composer__input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border-default); border-radius: var(--radius-pill); font: inherit; font-size: var(--fs-body-sm); color: var(--text-primary); background: var(--surface-card); outline: none; }
  .composer__input:focus { border-color: var(--brand-gold); box-shadow: var(--shadow-focus); }
  .composer__send {
    width: 44px; height: 44px; flex: none; border-radius: var(--radius-pill); border: none; cursor: pointer;
    background: var(--brand-gold); color: var(--neutral-950); box-shadow: var(--shadow-gold);
    display: flex; align-items: center; justify-content: center;
  }
  .composer__send:hover { background: var(--gold-600); }
  .composer__send:active { transform: scale(.98); }

  .ic { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* ---------- Focus ----------
     Trình duyệt mặc định vẽ vòng xanh — không phải màu của DS. Dùng
     --border-focus cho mọi thứ bấm được; ô nhập giữ viền vàng + --shadow-focus
     sẵn có nên tắt outline để khỏi hai vòng chồng nhau. */
  :focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
  .input:focus-visible, .textarea:focus-visible, .select:focus-visible,
  .composer__input:focus-visible { outline: none; }

  /* ---------- Vá dark mode ----------
     --gold-50 / --navy-50 là thang màu thô: KHÔNG tự đảo theo theme, trong khi
     --text-* thì có. Nền sáng + chữ sáng = mất chữ, nên các bề mặt này phải
     retint riêng cho dark thay vì giữ nguyên nền kem. */
  [data-theme="dark"] .addr-picked { background: rgba(244, 185, 49, .10); }
  [data-theme="dark"] .addr-picked__t { color: var(--neutral-0); }
  [data-theme="dark"] .recent:hover,
  [data-theme="dark"] .photo-add:hover { background: rgba(244, 185, 49, .10); }
  [data-theme="dark"] .chip[aria-pressed="true"] { background: rgba(244, 185, 49, .12); color: var(--brand-gold); }

  [data-theme="dark"] .party-h__ic--from { background: rgba(244, 185, 49, .12); }
  [data-theme="dark"] .party-h__ic--to { background: rgba(31, 61, 110, .35); color: var(--navy-200); }
  [data-theme="dark"] .order__ic { background: rgba(31, 61, 110, .35); color: var(--navy-200); }
  [data-theme="dark"] .suggest__row:hover,
  [data-theme="dark"] .btn--outline:hover,
  [data-theme="dark"] .btn--dashed:hover,
  [data-theme="dark"] .composer__attach:hover { background: var(--surface-sunken); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

  /* ============================================================

     ============================================================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function icon(name, size) { return '<svg class="ic" width="' + (size || 16) + '" height="' + (size || 16) + '"><use href="#i-' + name + '"></use></svg>'; }
  function fmt(usd) {
    var r = RATES[S.currency] || RATES.USD;
    return r[1] + (usd * r[0]).toLocaleString('en-US', { minimumFractionDigits: r[2], maximumFractionDigits: r[2] });
  }
  function now() { return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }); }
  function fmtSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
  function plural(n, w) { return n + ' ' + w + (n > 1 ? 's' : ''); }

  /* Mã tracking: 12 chữ số. Lưu dạng thô (đủ 12 số), hiển thị nhóm 4-4-4 cho dễ đọc. */
  function genTracking() {
    var n = '';
    for (var i = 0; i < 12; i++) n += Math.floor(Math.random() * 10);
    return n;
  }
  function fmtTracking(code) {
    var s = String(code == null ? '' : code).replace(/\D/g, '');
    return /^\d{12}$/.test(s) ? s.replace(/(\d{4})(\d{4})(\d{4})/, '$1 $2 $3') : String(code);
  }

  /* Picker: đoạn đầu địa chỉ làm tiêu đề, phần còn lại làm dòng phụ; khoảng cách
     là số giả ổn định (suy từ ký tự) để không nhảy loạn mỗi lần vẽ lại. */
  function titleOf(addr) { return (String(addr).split(',')[0] || String(addr)).trim(); }
  function restOf(addr) { var p = String(addr).split(','); return p.slice(1).join(',').trim() || String(addr); }
  function distanceFor(addr) {
    var s = 0; for (var i = 0; i < String(addr).length; i++) s += String(addr).charCodeAt(i);
    var km = (s % 185) / 10;
    return (km < 1 ? km.toFixed(2) : km.toFixed(0)) + ' km';
  }

  /* Giá tạm tính TÍNH THEO CÂN: phí nền + (số kg × đơn giá/kg) + phụ phí dễ vỡ / pin.
     Đơn giá/kg được nêu rõ để khách dễ nhìn. */
  var RATE_PER_KG = 6;   // USD / kg
  var BASE_FEE = 15;     // phí lấy hàng quốc tế cơ bản
  function itemWeight(i) {
    if (i.actualWeight != null) return i.actualWeight;   // đơn đã cân thực tế
    if (i.estWeight != null) return i.estWeight;         // đơn cũ (itemList)
    var w = parseFloat(i.weight);                        // form đang nhập
    return isNaN(w) ? 0 : w;
  }
  function estimateFrom(list) {
    var fragile = list.filter(function (i) { return i.fragile; }).length;
    var battery = list.filter(function (i) { return i.battery; }).length;
    var weight = list.reduce(function (a, b) { return a + itemWeight(b); }, 0);
    var lines = [{ label: 'Base international pickup', val: fmt(BASE_FEE) }];
    lines.push({ label: 'Shipping · ' + weight.toFixed(1) + ' kg × ' + fmt(RATE_PER_KG) + '/kg', val: fmt(weight * RATE_PER_KG) });
    if (fragile) lines.push({ label: 'Fragile handling × ' + fragile, val: fmt(fragile * 4) });
    if (battery) lines.push({ label: 'Battery declaration × ' + battery, val: fmt(battery * 2) });
    return { lines: lines, total: BASE_FEE + weight * RATE_PER_KG + fragile * 4 + battery * 2, weight: weight, ratePerKg: RATE_PER_KG };
  }
  function statusOf(stage) {
    if (stage >= 6) return ['Delivered', 'green'];
    if (stage >= 3) return ['In transit', 'blue'];
    if (stage >= 2) return ['Picked up', 'blue'];
    if (stage >= 1) return ['Confirmed', 'gold'];
    return ['Awaiting confirmation', 'grey'];

  function suggestions(key) {
    var st = S[key];
    var country = key === 'pickup' ? S.originCountry : S.destCountry;
    var q = st.query.trim().toLowerCase();
    if (!q) return [];
    var list = (ADDR[country] || []).filter(function (a) { return a.toLowerCase().indexOf(q) >= 0; }).slice(0, 5)
      .map(function (text) { return { text: text, value: text }; });
    if (st.query.trim().length > 3) list.push({ text: 'Use exactly: "' + st.query.trim() + '"', value: st.query.trim() });
    return list;
  }

        '<span class="order__price">' + esc(fmt(est.total)) + '</span>' +
        '<span class="badge badge--' + st[1] + '">' + st[0] + '</span>' +
        '<span class="order__bar"><i class="' + (o.stage >= 6 ? 'is-done' : '') + '" style="width:' + Math.max(6, Math.round((o.stage / 6) * 100)) + '%"></i></span>' +
        '</button>';
    }).join('');
    return '<div class="head-row"><div><h1 class="h1">My shipments</h1>' +
      '<p class="lead">Track every booking from pickup to delivery.</p></div>' +
      '<button class="btn btn--primary" data-go="book" type="button">' + icon('plus') + 'New booking</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:var(--space-3)">' + rows + '</div>';
  }

  /* ============================================================
     RENDER — Tracking
     ============================================================ */
  function renderTrack() {
    var active = S.orders.filter(function (o) { return o.id === S.activeOrder; })[0] || S.orders[0];
    var d = active.detail || {};
    var list = d.itemList || [];
    var st = statusOf(active.stage);
    var pickedUp = active.stage >= 2;
    var estW = list.reduce(function (a, b) { return a + (b.estWeight || 0); }, 0);
    var actW = list.reduce(function (a, b) { return a + (b.actualWeight || 0); }, 0);
    var price = estimateFrom(list);

    var items = list.map(function (it, i) {
      var tags = [it.fragile && 'Fragile', it.battery && 'Contains battery'].filter(Boolean).join(' · ');
      var meta = (it.photos ? plural(it.photos, 'photo') : 'No photos') + (tags ? ' · ' + tags : '');
      var hasActual = pickedUp && it.actualWeight != null;
      return '<div class="li" style="align-items:flex-start">' +
        '<span class="item-num" style="width:26px;height:26px;font-size:var(--fs-overline)">' + (i + 1) + '</span>' +
        '<div style="flex:1;min-width:0"><div class="li__t">' + esc(it.name) + '</div><div class="li__m">' + esc(meta) + '</div></div>' +
        '<div style="text-align:right;flex:none;font-size:var(--fs-caption);font-weight:' + (hasActual ? 'var(--fw-bold)' : 'var(--fw-semibold)') + '">' +
        esc(hasActual ? it.actualWeight + ' kg' : (it.estWeight ? it.estWeight + ' kg' : '—')) + '</div></div>';
    }).join('');

    var stages = STAGES.map(function (label, i) {
      var done = i <= active.stage, cur = i === active.stage + 1;
      var inner = done ? icon('check', 12) : (cur ? '<img src="../assets/airplane.svg" alt="">' : '');
      return '<div class="tl"><div class="tl__gut">' +
        '<span class="tl__dot' + (done ? ' is-done' : '') + (cur ? ' is-cur' : '') + '">' + inner + '</span>' +
        (i < STAGES.length - 1 ? '<span class="tl__line' + (done ? ' is-done' : '') + '"></span>' : '') + '</div>' +
        '<div class="tl__body"><div class="tl__label' + (done || cur ? ' is-on' : '') + '">' + esc(label) + '</div>' +
        '<div class="tl__time">' + (done ? STAGE_TIMES[i] : (cur ? 'Up next' : '')) + '</div></div></div>';
    }).join('');

    return '<div style="max-width:1000px;margin:0 auto">' +
      '<button class="back-link" data-go="orders" type="button">' + icon('chevron-left', 15) + 'All shipments</button>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:6px">' +
        '<div><div class="rail__cap" style="margin-bottom:2px">Tracking code</div>' +
          '<h1 class="h1" style="font-size:var(--fs-h3);margin:0;letter-spacing:1px">' + esc(fmtTracking(active.id)) + '</h1></div>' +
        '<span class="badge badge--' + st[1] + '">' + st[0] + '</span></div>' +
      '<div style="font-size:var(--fs-body-sm);color:var(--text-secondary);margin-bottom:var(--space-6)">' +
        esc(active.from) + ' → ' + esc(active.to) + ' · ' + plural(active.items, 'item') + ' · ' + esc(fmt(price.total)) + '</div>' +
      '<div class="grid2 grid2--tight"><div class="col">' +
        '<div class="card"><div class="cap">Route &amp; contacts</div><div class="rail">' +
          '<div class="rail__line"><span class="rail__dot"></span><span class="rail__bar"></span><span class="rail__dot rail__dot--end"></span></div>' +
          '<div class="rail__body">' +
            '<div><div class="rail__cap">From · ' + esc(active.originCountry || '') + '</div>' +
              '<div class="rail__who">' + esc(d.sender || 'Sender') + ' · ' + esc(d.senderPhone || '—') + '</div>' +
              '<div class="rail__addr">' + esc(d.fromAddr || active.from) + '</div></div>' +
            '<div><div class="rail__cap">To · ' + esc(active.destCountry || '') + '</div>' +
              '<div class="rail__who">' + esc(d.recipient || 'Recipient') + ' · ' + esc(d.recipientPhone || '—') + '</div>' +
              '<div class="rail__addr">' + esc(d.toAddr || active.to) + '</div></div>' +
          '</div></div>' +
          (d.note ? '<div class="pickup-note"><b>Pickup note: </b>' + esc(d.note) + '</div>' : '') +
        '</div>' +
        '<div class="card"><div class="cap">Items (' + plural(active.items, 'item') + ')</div>' +
          '<div class="stack">' + items + '</div>' +
          '<div class="divide">' +
            (pickedUp
              ? '<div class="split"><span>Total weight</span><span style="font-weight:var(--fw-bold);color:var(--text-primary)">' + actW.toFixed(1) + ' kg</span></div>'
              : '<div class="split"><span>Estimated weight</span><span style="font-weight:var(--fw-semibold)">' + (estW ? estW.toFixed(1) : '0') + ' kg</span></div>' +
                '<div style="font-size:var(--fs-overline);color:var(--text-tertiary);line-height:var(--lh-normal)">Actual weight is measured once our courier collects the items.</div>') +
          '</div>' +
          '<div class="divide">' +
            '<div class="rate-box rate-box--light">' +
              '<div><span class="k">Shipping rate</span><span class="v">' + esc(fmt(price.ratePerKg)) + ' <small>/ kg</small></span></div>' +
              '<div class="w"><b>' + price.weight.toFixed(1) + ' kg</b><span>' + (pickedUp ? 'actual weight' : 'est. weight') + '</span></div>' +
            '</div>' +
            price.lines.map(function (l) { return '<div class="split"><span>' + esc(l.label) + '</span><span>' + esc(l.val) + '</span></div>'; }).join('') +
            '<div class="split" style="border-top:1px solid var(--border-subtle);padding-top:10px;margin-top:2px;align-items:baseline">' +
              '<span>Total</span><span style="font-family:var(--font-display);font-size:var(--fs-h4);font-weight:var(--fw-bold);color:var(--text-primary)">' + esc(fmt(price.total)) + '</span></div>' +
          '</div></div>' +
      '</div>' +
      '<div class="card card--raised" style="padding:var(--space-6)"><div class="cap">Tracking</div>' +
        '<div style="display:flex;flex-direction:column">' + stages + '</div>' +
        '<div style="border-top:1px solid var(--border-subtle);padding-top:20px;display:flex">' +
          '<button class="btn btn--primary" data-go="chat" type="button" style="flex:1;padding:16px 28px;font-size:var(--fs-body)">' + icon('chat', 17) + 'Chat about this shipment</button>' +
        '</div></div>' +
      '</div></div>';
  }

  /* ============================================================
     RENDER — Chat
     ============================================================ */
  function attachmentHTML(a, mine) {
    if (a.isImage) return '<img class="att-img" src="' + esc(a.url) + '" alt="' + esc(a.name) + '">';
    return '<div class="att-file"><span class="att-file__ic">' + esc(a.ext) + '</span>' +
      '<div style="min-width:0"><div class="att-file__n">' + esc(a.name) + '</div>' +
      '<div class="att-file__s">' + esc(a.size) + '</div></div></div>';
  }

  function renderChat() {
    var msgs = S.messages.map(function (m) {
      if (m.who === 'system') return '<div class="sysmsg">' + esc(m.text) + '</div>';
      var mine = m.who === 'me';
      var atts = (m.attachments || []).map(function (a) { return attachmentHTML(a, mine); }).join('');
      return '<div class="msg-row' + (mine ? ' msg-row--me' : '') + '">' +
        '<div class="bubble' + (mine ? ' bubble--me' : '') + '">' + atts +
        (m.text && m.text.trim() ? '<div class="bubble__t">' + esc(m.text) + '</div>' : '') +
        '<div class="bubble__time">' + esc(m.time || '') + '</div></div></div>';
    }).join('');

    var pending = S.pending.length ? '<div class="pending">' + S.pending.map(function (a, i) {
      return '<div class="pending__item">' +
        (a.isImage ? '<img class="pending__img" src="' + esc(a.url) + '" alt="">' :
          '<div class="pending__file"><span class="att-file__ic">' + esc(a.ext) + '</span>' +
          '<div style="min-width:0"><div class="att-file__n" style="max-width:120px;font-size:var(--fs-overline)">' + esc(a.name) + '</div>' +
          '<div class="att-file__s" style="font-size:var(--fs-overline)">' + esc(a.size) + '</div></div></div>') +
        '<button class="pending__x" type="button" data-rmpending="' + i + '">' + icon('x', 11) + '</button></div>';
    }).join('') + '</div>' : '';

    return '<div class="chat">' +
      '<div class="chat__head">' +
        '<span class="chat__avatar">' +
          '<img class="chat__avatar--light" src="../assets/tiximax-symbol-circle-navy.svg" alt="TIXIMAX Support">' +
          '<img class="chat__avatar--dark" src="../assets/tiximax-symbol-circle-gold.svg" alt="TIXIMAX Support">' +
          '<i></i></span>' +
        '<div style="flex:1;min-width:0"><div class="chat__name">TIXIMAX Support</div>' +
        '<div class="chat__status"><i></i>Online · replies in minutes</div></div></div>' +
      '<div class="chat__body" id="chatBody">' + msgs + '</div>' + pending +
      '<div class="composer">' +
        '<label class="composer__attach" title="Attach photo or file">' + icon('paperclip', 19) +
          '<input type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip" hidden id="attachInput"></label>' +
        '<input class="composer__input" id="chatInput" placeholder="Type a message…" value="' + esc(S.chatInput) + '">' +
        '<button class="composer__send" id="sendBtn" type="button">' + icon('send', 17) + '</button>' +
      '</div></div>';
  }

  /* ============================================================
     RENDER chung
     ============================================================ */
  function render() {
    var isBook = S.view === 'book', isOrders = S.view === 'orders', isTrack = S.view === 'track', isChat = S.view === 'chat';
    $('viewBook').hidden = !isBook;
    $('viewOrders').hidden = !isOrders;
    $('viewTrack').hidden = !isTrack;
    $('viewChat').hidden = !isChat;
    if (isBook) $('viewBook').innerHTML = renderBook();
    if (isOrders) $('viewOrders').innerHTML = renderOrders();
    if (isTrack) $('viewTrack').innerHTML = renderTrack();
    if (isChat) {
      $('viewChat').innerHTML = renderChat();
      var body = $('chatBody');
      if (body) body.scrollTop = body.scrollHeight;
    }
    document.querySelectorAll('.nav__btn').forEach(function (b) {
      var on = b.dataset.view === S.view || (b.dataset.view === 'orders' && S.view === 'track');
      b.classList.toggle('is-active', on);
    });
    $('navDot').hidden = S.unread === 0;
  }

  /* ---------- Dropdown chọn địa chỉ ----------
     Dựng lại danh sách ngay dưới ô đang gõ mà KHÔNG đụng tới node input,
     nên con trỏ và focus của ô nhập được giữ nguyên. */
  function paintDrop(key) {
    var input = document.querySelector('[data-addrq="' + key + '"]');
    if (!input) return;
    var anchor = input.closest('.addr-anchor');
    var old = anchor.querySelector('.addr-drop');
    if (old) old.remove();
    var st = S[key];
    if (st.focus && !st.selected) anchor.insertAdjacentHTML('beforeend', renderAddrDrop(key));
  }
  function pickAddr(key, addr) {
    if (!addr) return;
    S[key].selected = addr; S[key].query = ''; S[key].focus = false;
    render();
  }
  function focusAddr(key) { var s = document.querySelector('[data-addrq="' + key + '"]'); if (s) s.focus(); }

  /* ============================================================
     TƯƠNG TÁC
     ============================================================ */
  function go(view) {
    if (view === 'book' && S.step >= 4) {
      S.step = 1;
      S.pickup = { query: '', selected: null, postal: '', name: '', phone: '', dial: DIAL[S.originCountry] || '+62', note: '', focus: false };
      S.drop = { query: '', selected: null, postal: '', name: '', phone: '', dial: DIAL[S.destCountry] || '+81', focus: false };
      S.items = [{ name: '', fragile: false, battery: false, photos: [], weight: '' }];
      S.newOrderId = genTracking();
    }
    if (view === 'chat') S.unread = 0;
    S.view = view;
    render();
  }

  document.querySelectorAll('.nav__btn').forEach(function (b) {
    b.addEventListener('click', function () { go(b.dataset.view); });
  });
  $('brandHome').addEventListener('click', function () { go('book'); });

  /* Click uỷ quyền cho toàn bộ nội dung động */
  document.querySelector('.main').addEventListener('click', function (e) {
    var t = e.target;
    var hit = function (attr) { var el = t.closest('[' + attr + ']'); return el ? el : null; };
    var el;

    if ((el = hit('data-go'))) { go(el.dataset.go); return; }
    if ((el = hit('data-order'))) { S.activeOrder = el.dataset.order; S.view = 'track'; render(); return; }
    if ((el = hit('data-step'))) { var n = +el.dataset.step; if (n < S.step) { S.step = n; render(); } return; }
    if ((el = hit('data-recent'))) {
      var k2 = el.dataset.recent;
      S[k2].selected = recents(k2)[+el.dataset.i]; S[k2].query = ''; render(); return;
    }
    if ((el = hit('data-clear'))) { S[el.dataset.clear].selected = null; S[el.dataset.clear].query = ''; S[el.dataset.clear].focus = true; render(); focusAddr(el.dataset.clear); return; }
    if ((el = hit('data-rmitem'))) { S.items.splice(+el.dataset.rmitem, 1); render(); return; }
    if ((el = hit('data-rmphoto'))) {
      var it = S.items[+el.dataset.rmphoto];
      URL.revokeObjectURL(it.photos[+el.dataset.j]);
      it.photos.splice(+el.dataset.j, 1); render(); return;
    }
    if ((el = hit('data-fragile'))) { var f = S.items[+el.dataset.fragile]; f.fragile = !f.fragile; render(); return; }
    if ((el = hit('data-battery'))) { var b2 = S.items[+el.dataset.battery]; b2.battery = !b2.battery; render(); return; }
    if ((el = hit('data-rmpending'))) { S.pending.splice(+el.dataset.rmpending, 1); render(); return; }

    switch (t.closest('button') && t.closest('button').id) {
      case 'swapBtn':
        var o = S.originCountry; S.originCountry = S.destCountry; S.destCountry = o;
        S.pickup.selected = null; S.pickup.query = ''; S.pickup.postal = ''; S.pickup.dial = DIAL[S.originCountry] || S.pickup.dial;
        S.drop.selected = null; S.drop.query = ''; S.drop.postal = ''; S.drop.dial = DIAL[S.destCountry] || S.drop.dial;
        render(); break;
      case 'toStep2': if (step1Ready()) { S.step = 2; render(); } break;
      case 'toStep1': S.step = 1; render(); break;
      case 'toStep3': if (step2Ready()) { S.step = 3; render(); } break;
      case 'backTo2': S.step = 2; render(); break;
      case 'addItem': S.items.push({ name: '', fragile: false, battery: false, photos: [], weight: '' }); render(); break;
      case 'submitBooking': submitBooking(); break;
      case 'sendBtn': sendChat(); break;
      default: break;
    }
  });

  /* Chọn 1 dòng địa chỉ trong dropdown: dùng mousedown để chạy TRƯỚC blur của ô nhập */
  document.querySelector('.main').addEventListener('mousedown', function (e) {
    var el = e.target.closest('[data-pick]');
    if (!el) return;
    e.preventDefault();   // giữ focus ở ô nhập, không để blur đóng dropdown trước
    pickAddr(el.dataset.pick, decodeURIComponent(el.dataset.addr || ''));
  });

  /* Nhập liệu (input/change) — cũng uỷ quyền, tránh mất listener khi render lại */
  document.querySelector('.main').addEventListener('input', function (e) {
    var t = e.target, d = t.dataset;
    if (d.addrq != null) { S[d.addrq].query = t.value; paintDrop(d.addrq); return; }
    if (d.name != null) { S[d.name].name = t.value; return; }
    if (d.phone != null) { S[d.phone].phone = t.value; return; }
    if (d.postal != null) { S[d.postal].postal = t.value; return; }
    if (d.note != null) { S[d.note].note = t.value; return; }
    if (d.iname != null) { S.items[+d.iname].name = t.value; syncStep2Btn(); return; }
    if (d.iweight != null) { S.items[+d.iweight].weight = t.value; return; }
    if (t.id === 'chatInput') { S.chatInput = t.value; }
  });

  document.querySelector('.main').addEventListener('focusin', function (e) {
    var d = e.target.dataset;
    if (d && d.addrq != null) { S[d.addrq].focus = true; paintDrop(d.addrq); }
  });
  document.querySelector('.main').addEventListener('focusout', function (e) {
    var d = e.target.dataset;
    if (d && d.addrq != null) {
      var key = d.addrq;   // chờ chút để mousedown chọn dòng kịp chạy trước khi đóng
      setTimeout(function () { S[key].focus = false; paintDrop(key); }, 150);
    }
  });

  /* Đổi tên món chỉ cần bật/tắt nút, không vẽ lại cả màn (giữ nguyên con trỏ) */
  function syncStep2Btn() {
    var btn = $('toStep3');
    if (btn) btn.disabled = !step2Ready();
  }

  document.querySelector('.main').addEventListener('change', function (e) {
    var t = e.target, d = t.dataset;
    if (d.dial != null) { S[d.dial].dial = t.value; return; }
    if (t.id === 'selOrigin') { S.originCountry = t.value; S.pickup.selected = null; S.pickup.query = ''; S.pickup.postal = ''; S.pickup.dial = DIAL[t.value] || S.pickup.dial; render(); return; }
    if (t.id === 'selDest') { S.destCountry = t.value; S.drop.selected = null; S.drop.query = ''; S.drop.postal = ''; S.drop.dial = DIAL[t.value] || S.drop.dial; render(); return; }
    if (d.photos != null) {
      var it = S.items[+d.photos];
      Array.prototype.forEach.call(t.files || [], function (f) { it.photos.push(URL.createObjectURL(f)); });
      t.value = ''; render(); return;
    }
    if (t.id === 'attachInput') {
      Array.prototype.forEach.call(t.files || [], function (f) {
        S.pending.push({
          name: f.name, size: fmtSize(f.size), isImage: f.type.indexOf('image/') === 0,
          url: URL.createObjectURL(f), ext: (f.name.split('.').pop() || 'file').toUpperCase().slice(0, 4)
        });
      });
      t.value = ''; render();
    }
  });

  document.querySelector('.main').addEventListener('keydown', function (e) {
    var d = e.target.dataset;
    if (e.target.id === 'chatInput' && e.key === 'Enter') { e.preventDefault(); sendChat(); return; }
    if (d && d.addrq != null) {
      var key = d.addrq;
      if (e.key === 'Enter') { e.preventDefault(); var first = addrList(key)[0] || S[key].query.trim(); pickAddr(key, first); }
      else if (e.key === 'Escape') { e.target.blur(); }   // blur → focusout đóng dropdown
    }
  });

  /* ---------- Gửi booking ---------- */
  function cityOf(addr, country) {
    var part = (addr.split(',').slice(-2)[0] || '').replace(/\d+/g, '').trim();
    return (part || country) + ', ' + (ISO[country] || country);
  }
  function submitBooking() {
    var est = estimateFrom(S.items);
    var order = {
      id: S.newOrderId,
      from: cityOf(S.pickup.selected, S.originCountry),
      to: cityOf(S.drop.selected, S.destCountry),
      items: S.items.length, date: 'Jul 23', stage: 0, price: est.total,
      originCountry: S.originCountry, destCountry: S.destCountry,
      detail: {
        fromAddr: S.pickup.selected, sender: S.pickup.name.trim() || 'Sender', senderPhone: S.pickup.phone ? (S.pickup.dial + ' ' + S.pickup.phone) : '—', note: S.pickup.note || '',
        toAddr: S.drop.selected, recipient: S.drop.name.trim() || 'Recipient', recipientPhone: S.drop.phone ? (S.drop.dial + ' ' + S.drop.phone) : '—',
        itemList: S.items.map(function (it) {
          return { name: it.name.trim() || 'Untitled item', fragile: it.fragile, battery: it.battery,
                   photos: it.photos.length, estWeight: parseFloat(it.weight) || 0, actualWeight: null };
        })
      }
    };
    S.orders.unshift(order);
    S.step = 4; S.unread = 1;
    S.messages.push({ who: 'system', text: 'Booking ' + fmtTracking(S.newOrderId) + ' submitted · ' + plural(S.items.length, 'item') });
    S.messages.push({ who: 'agent', time: now(),
      text: 'Thanks! We received booking ' + fmtTracking(S.newOrderId) + '. We are reviewing your items and will confirm the final price and a pickup window shortly. Anything we should know before the courier arrives?' });
    render();
  }

  /* ---------- Chat ---------- */
  var replyTimer = null;
  function sendChat() {
    var text = S.chatInput.trim(), atts = S.pending;
    if (!text && !atts.length) return;
    S.messages.push({ who: 'me', text: text, time: now(), attachments: atts });
    S.chatInput = ''; S.pending = [];
    render();
    clearTimeout(replyTimer);
    var reply = atts.length
      ? 'Thanks, we received your ' + (atts.length > 1 ? atts.length + ' files' : 'file') + '. Our team will review it and get back to you shortly.'
      : 'Got it! Our team will get back to you shortly with the confirmed details.';
    replyTimer = setTimeout(function () {
      S.messages.push({ who: 'agent', text: reply, time: now() });
      if (S.view !== 'chat') S.unread = 1;
      render();
    }, 1400);
  }

  /* ---------- Sáng / tối ---------- */
  var root = document.documentElement;
  $('themeToggle').addEventListener('click', function () {
    var dark = root.dataset.theme === 'dark';
    root.dataset.theme = dark ? 'light' : 'dark';
    $('themeIcon').querySelector('use').setAttribute('href', dark ? '#i-moon' : '#i-sun');
    $('themeLabel').textContent = dark ? 'Dark' : 'Light';
  });

  render();
})();
</script>
</body>
</html>
