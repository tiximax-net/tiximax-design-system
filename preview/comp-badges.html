<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges & chips" subtitle="Status badges + filter chips" viewport="700x310" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card)}
  .surface{padding:24px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:var(--fw-medium);
         padding:4px 8px;border-radius:4px;line-height:1.4}
  .badge svg{width:13px;height:13px}
  .b-gold{background:var(--gold-100);color:var(--gold-700)}
  .b-navy{background:var(--navy-100);color:var(--navy-700)}
  .b-green{background:var(--success-bg);color:var(--text-success)}
  .b-red{background:var(--error-bg);color:var(--text-error)}
  .b-solid{background:var(--brand-gold);color:var(--navy-900)}
  .b-success{background:var(--success-bg);color:var(--text-success)}
  .b-warning{background:var(--warning-bg);color:var(--text-warning)}
  .b-error{background:var(--error-bg);color:var(--text-error)}
  .b-info{background:var(--info-bg);color:var(--text-info)}
  /* dot status badges */
  .b-dot{background:transparent;padding-left:0;padding-right:0;color:var(--text-primary);gap:6px}
  .b-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .dot-green::before{background:var(--success)}
  .dot-gold::before{background:var(--brand-gold)}
  .dot-red::before{background:var(--error)}
  .dot-navy::before{background:var(--brand-navy)}
  .dot-grey::before{background:var(--text-tertiary)}
  .b-dot span{color:var(--text-primary)}
  /* number / count badges */
  .b-num{display:inline-flex;align-items:center;justify-content:center;font-weight:var(--fw-medium);
         background:var(--brand-red);color:#fff;border-radius:var(--radius-pill)}
  .b-num.md{font-size:11px;min-width:18px;height:18px;padding:0 5px;line-height:1}
  .b-num.navy{background:var(--brand-navy)}
  .b-num.gold{background:var(--brand-gold);color:var(--navy-900)}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:var(--fw-medium);
        padding:4px 8px;border-radius:4px;background:var(--surface-sunken);
        color:var(--text-primary);border:1px solid var(--border-default)}
  .chip svg{width:13px;height:13px;color:var(--text-tertiary);cursor:pointer}
  .chip.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
  .lbl{font-size:11px;color:var(--text-tertiary);font-weight:var(--fw-medium);width:54px}
</style>
</head>
<body>
 <div class="ds-modes">
  <div class="ds-mode"><span class="ds-mode__tag">Light</span><div class="surface">
  <div class="row"><span class="lbl">Badges</span>
    <span class="badge b-gold">Mới</span>
    <span class="badge b-green"><i data-lucide="check"></i>Đã giao</span>
    <span class="badge b-navy"><i data-lucide="warehouse"></i>Tại kho</span>
    <span class="badge b-red"><i data-lucide="alert-triangle"></i>Trễ hẹn</span>
    <span class="badge b-solid">VIP</span>
  </div>
  <div class="row"><span class="lbl">Semantic</span>
    <span class="badge b-success"><i data-lucide="check-circle"></i>Success</span>
    <span class="badge b-warning"><i data-lucide="alert-triangle"></i>Warning</span>
    <span class="badge b-error"><i data-lucide="x-circle"></i>Error</span>
    <span class="badge b-info"><i data-lucide="info"></i>Info</span>
  </div>
  <div class="row"><span class="lbl">Dot</span>
    <span class="badge b-dot dot-green">Đang hoạt động</span>
    <span class="badge b-dot dot-gold">Chờ xử lý</span>
    <span class="badge b-dot dot-red">Ngừng</span>
    <span class="badge b-dot dot-navy">Đang giao</span>
    <span class="badge b-dot dot-grey">Nháp</span>
  </div>
  <div class="row"><span class="lbl">Số</span>
    <span class="b-num md">3</span>
    <span class="b-num md">12</span>
    <span class="b-num md">99+</span>
    <span class="b-num md navy">8</span>
    <span class="b-num md gold">5</span>
  </div>
  <div class="row"><span class="lbl">Chips</span>
    <span class="chip active">Tất cả</span>
    <span class="chip">Đang xử lý</span>
    <span class="chip">Đang vận chuyển</span>
    <span class="chip">Nhật Bản <i data-lucide="x"></i></span>
    <span class="chip">Hàn Quốc <i data-lucide="x"></i></span>
  </div>
  </div></div>
  <div class="ds-mode dark"><span class="ds-mode__tag">Dark</span><div class="surface" id="darkBody"></div></div>
 </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    document.getElementById('darkBody').innerHTML=document.querySelector('.ds-mode:not(.dark) .surface').innerHTML;
    lucide.createIcons();
  </script>
</body>
</html>
