<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success, Warning, Error, Info — with bg & border tokens" viewport="1100x220" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-page)}
  .surface{padding:36px 40px}
  .stitle{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .item{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden}
  .bar{height:42px}
  .body{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .dot{width:18px;height:18px;border-radius:50%}
  .t{font-size:17px;font-weight:var(--fw-semibold);color:var(--text-primary)}
  .h{font-size:14px;color:var(--text-tertiary)}
</style>
</head>
<body>
 <div class="ds-modes">
  <div class="ds-mode"><span class="ds-mode__tag">Light</span><div class="surface">
  <div class="stitle">Semantic</div>
  <div class="grid">
    <div class="item"><div class="bar" style="background:var(--success-bg);border-bottom:2px solid var(--success)"></div><div class="body"><span class="dot" style="background:var(--success)"></span><div><div class="t">Success</div><div class="h">#008148</div></div></div></div>
    <div class="item"><div class="bar" style="background:var(--warning-bg);border-bottom:2px solid var(--warning)"></div><div class="body"><span class="dot" style="background:var(--warning)"></span><div><div class="t">Warning</div><div class="h">#F4B931</div></div></div></div>
    <div class="item"><div class="bar" style="background:var(--error-bg);border-bottom:2px solid var(--error)"></div><div class="body"><span class="dot" style="background:var(--error)"></span><div><div class="t">Error</div><div class="h">#EB5635</div></div></div></div>
    <div class="item"><div class="bar" style="background:var(--info-bg);border-bottom:2px solid var(--info)"></div><div class="body"><span class="dot" style="background:var(--info)"></span><div><div class="t">Info</div><div class="h">#006FBB</div></div></div></div>
  </div>
  </div></div>
  <div class="ds-mode dark"><span class="ds-mode__tag">Dark</span><div class="surface" id="darkBody"></div></div>
 </div>
  <script>document.getElementById('darkBody').innerHTML=document.querySelector('.ds-mode:not(.dark) .surface').innerHTML;</script>
<style>.chip,.cell,.bar,.dot,.sw{cursor:pointer}#hexToast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--brand-navy,#264F91);color:#fff;font:600 12px/1 var(--font-sans,sans-serif);padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:99}#hexToast.show{opacity:1}</style>
<div id="hexToast"></div>
<script>
/* copy-hex: click ô màu → copy #HEX (đọc computed background-color) */
(function(){
  function toHex(c){var m=(c||"").match(/\d+(\.\d+)?/g);if(!m)return null;return "#"+m.slice(0,3).map(function(n){return Math.round(+n).toString(16).padStart(2,"0")}).join("").toUpperCase();}
  var toast=document.getElementById("hexToast"),tm;
  function show(h){toast.textContent="✓ "+h;toast.classList.add("show");clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove("show")},1100);}
  document.addEventListener("click",function(e){
    var el=e.target.closest(".chip,.cell,.bar,.dot,.sw");if(!el)return;
    var bg=getComputedStyle(el).backgroundColor;
    if(bg==="rgba(0, 0, 0, 0)"||bg==="transparent"){var inner=el.querySelector(".chip,.cell,.bar,.dot");if(inner)bg=getComputedStyle(inner).backgroundColor;}
    var hex=toHex(bg);if(!hex)return;
    try{navigator.clipboard.writeText(hex).then(function(){show(hex)},function(){show(hex)});}catch(_){show(hex);}
  });
})();
</script>
</body>
</html>
