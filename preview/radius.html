<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radius" subtitle="xs 4px → pill" viewport="700x160" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-page)}
  .surface{padding:22px 24px}
  .grid{display:flex;gap:16px;align-items:flex-end}
  .item{text-align:center}
  .box{width:78px;height:60px;background:var(--navy-100);border:1.5px solid var(--navy-300)}
  .lbl{font-size:11px;font-weight:var(--fw-semibold);color:var(--text-primary);margin-top:8px}
  .px{font-size:11px;color:var(--text-tertiary)}
</style>
</head>
<body>
 <div class="ds-modes">
  <div class="ds-mode"><span class="ds-mode__tag">Light</span><div class="surface">
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lbl">xs</div><div class="px">4px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm</div><div class="px">6px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg</div><div class="px">14px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl</div><div class="px">20px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="lbl">2xl</div><div class="px">28px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="lbl">pill</div><div class="px">999px</div></div>
  </div>
  </div></div>
  <div class="ds-mode dark"><span class="ds-mode__tag">Dark</span><div class="surface" id="darkBody"></div></div>
 </div>
  <script>document.getElementById('darkBody').innerHTML=document.querySelector('.ds-mode:not(.dark) .surface').innerHTML;</script>
</body>
</html>
