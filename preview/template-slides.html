<!DOCTYPE html>
<html lang="vi" data-lang-default="vi" data-langs="vi,ja,en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Deck templates</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../showcase.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);padding:24px}
  .wrap{max-width:960px;margin:0 auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="panel-label"><span data-i18n data-en="16:9 · 1920 × 1080px master · &lt;deck-stage&gt; · sample layouts" data-ja="16:9 · 1920 × 1080px マスター · &lt;deck-stage&gt; · 代表レイアウト" data-vi="16:9 · 1920 × 1080px · &lt;deck-stage&gt; · layouts tiêu biểu">16:9 · 1920 × 1080px master · &lt;deck-stage&gt; · layouts tiêu biểu</span></div>
    <div class="preview-grid-2">

      <!-- Cover -->
      <div>
        <div class="preview-item-label">Cover / 表紙</div>
        <div class="slide-scaler-idx">
          <div class="slide" style="background:#264F91;color:white;">
            <div style="position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#F4B931,#F7B82D);"></div>
            <div style="position:absolute;right:-260px;top:-260px;width:1100px;height:1100px;border-radius:50%;border:120px solid rgba(244,185,49,0.07);"></div>
            <div style="position:absolute;inset:0;padding:140px 150px;display:flex;flex-direction:column;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:28px;">
                <div style="width:80px;height:80px;border-radius:18px;background:#F4B931;"></div>
                <div style="font-size:48px;font-weight:800;letter-spacing:-0.01em;color:white;">Tiximax</div>
              </div>
              <div>
                <div style="font-size:30px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#F4B931;margin-bottom:30px;">Cross-Border Logistics</div>
                <div style="font-size:128px;font-weight:900;line-height:1.05;letter-spacing:-0.03em;color:white;">物流の未来を、<br><span style="color:#F4B931;">今</span></div>
              </div>
              <div style="display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,0.12);padding-top:36px;font-size:30px;color:rgba(255,255,255,0.45);">
                <span>Take Hitonari (武仁誠) · CEO</span><span>tiximax.net · 2026</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Section divider -->
      <div>
        <div class="preview-item-label">Section Divider / 章扉</div>
        <div class="slide-scaler-idx">
          <div class="slide" style="background:#0B172E;color:white;">
            <div style="position:absolute;left:-200px;bottom:-300px;width:900px;height:900px;border-radius:50%;border:120px solid rgba(244,185,49,0.10);"></div>
            <div style="position:absolute;left:120px;bottom:80px;font-size:300px;font-weight:900;color:rgba(244,185,49,0.14);line-height:1;letter-spacing:-0.05em;">01</div>
            <div style="position:absolute;inset:0;padding:0 150px;display:flex;flex-direction:column;justify-content:center;">
              <div style="font-size:30px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#F4B931;margin-bottom:24px;">Section 01</div>
              <div style="font-size:120px;font-weight:900;line-height:1.1;color:white;">サービス<br><span style="color:#F4B931;">概要</span></div>
              <div style="font-size:34px;color:rgba(255,255,255,0.5);margin-top:32px;">4つのコアサービス</div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /preview-grid-2 -->
    <a href="../slides-preview.html" target="_blank" class="open-link"><span data-i18n data-en="Open all layouts full-size — slides-preview.html ↗" data-ja="全レイアウトをフルサイズで開く — slides-preview.html ↗" data-vi="Mở tất cả layout full-size — slides-preview.html ↗">Mở tất cả layout full-size — slides-preview.html ↗</span></a>
  </div>
</div>
<script src="../showcase.js" defer></script>
</body>
</html>
