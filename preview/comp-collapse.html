<!DOCTYPE html>
<!-- @dsCard group="Components" name="Collapse (Accordion)" subtitle="Basic · Borderless · Ghost | S/M/L | Icon Left/Right | Default/Disabled" viewport="900x500" -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--surface-card)}
  .surface{padding:24px;display:flex;flex-direction:column;gap:24px}

  /* Labels */
  .section-lbl{font-size:13px;font-weight:var(--fw-bold);color:var(--text-primary);padding:10px 14px;background:var(--surface-sunken);border-radius:var(--radius-sm);border:1px solid var(--border-subtle);letter-spacing:var(--ls-wide);text-transform:uppercase}
  .sub-lbl{font-size:11px;font-weight:var(--fw-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-tertiary);margin:4px 0 0}
  .size-lbl{font-size:10px;font-weight:var(--fw-semibold);color:var(--text-disabled);letter-spacing:var(--ls-overline);text-transform:uppercase;margin-bottom:6px}
  .state-lbl{font-size:10px;color:var(--text-disabled);margin:6px 0 4px;font-style:italic}

  /* Grid */
  .size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .size-col{display:flex;flex-direction:column}
  .style-section{display:flex;flex-direction:column;gap:14px}

  /* ========== ACCORDION BASE ========== */
  .acc{overflow:hidden;transition:all .2s ease}

  /* — Header — */
  .acc-header{display:flex;align-items:center;cursor:pointer;font-weight:var(--fw-semibold);color:var(--text-primary);user-select:none}
  .acc-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acc-icon{flex:none;color:var(--text-tertiary)}

  /* — Body — */
  .acc-body{color:var(--text-secondary);line-height:var(--lh-normal);border-top:1px solid var(--border-subtle)}

  /* ========== SIZES ========== */
  /* Small */
  .acc.sm .acc-header{padding:6px 12px;font-size:13px;gap:6px}
  .acc.sm .acc-icon{width:14px;height:14px}
  .acc.sm .acc-body{padding:8px 12px;font-size:12px;margin:0}

  /* Medium */
  .acc.md .acc-header{padding:10px 16px;font-size:14px;gap:8px}
  .acc.md .acc-icon{width:16px;height:16px}
  .acc.md .acc-body{padding:10px 16px;font-size:13px;margin:0}

  /* Large */
  .acc.lg .acc-header{padding:14px 20px;font-size:16px;gap:10px}
  .acc.lg .acc-icon{width:18px;height:18px}
  .acc.lg .acc-body{padding:14px 20px;font-size:14px;margin:0}

  /* ========== STYLES ========== */
  /* Basic */
  .acc.basic{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}
  .acc.basic .acc-body{border-color:var(--border-default)}

  /* Borderless */
  .acc.borderless{background:transparent;border-bottom:1px solid var(--border-default);border-radius:0}
  .acc.borderless .acc-body{border-top:none}

  /* Ghost */
  .acc.ghost{background:transparent;border:none;border-radius:var(--radius-sm)}
  .acc.ghost .acc-header{border-radius:var(--radius-sm)}
  .acc.ghost .acc-body{border-top:none}

  /* ========== STATES ========== */
  /* Expanded — active header highlight */
  .acc.expanded .acc-header{color:var(--text-brand)}
  .acc.expanded .acc-icon{color:var(--text-brand)}

  /* Disabled */
  .acc.disabled{opacity:.45;pointer-events:none}
  .acc.disabled .acc-header{cursor:not-allowed}
</style>
</head>
<body>
 <div class="ds-modes">
  <div class="ds-mode"><span class="ds-mode__tag">Light</span><div class="surface" id="lightBody"></div></div>
  <div class="ds-mode dark"><span class="ds-mode__tag">Dark</span><div class="surface" id="darkBody"></div></div>
 </div>
 <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
 <script>
  const STYLES=[{name:'Basic',cls:'basic'},{name:'Borderless',cls:'borderless'},{name:'Ghost',cls:'ghost'}];
  const SIZES=[{name:'Small',cls:'sm'},{name:'Medium',cls:'md'},{name:'Large',cls:'lg'}];
  const TITLE='Thông tin vận chuyển';
  const BODY='Đơn hàng TX-48210 đang được vận chuyển từ kho Jakarta đến Hà Nội. Dự kiến giao trong 3–5 ngày.';

  function acc(styleCls,sizeCls,iconPos,expanded,disabled){
    const cls=['acc',styleCls,sizeCls];
    if(expanded) cls.push('expanded');
    if(disabled) cls.push('disabled');

    const chevron=iconPos==='left'
      ?(expanded?'chevron-down':'chevron-right')
      :(expanded?'chevron-up':'chevron-down');
    const ico=`<i data-lucide="${chevron}" class="acc-icon"></i>`;
    const ttl=`<span class="acc-title">${TITLE}</span>`;
    const header=iconPos==='left'?`${ico}${ttl}`:`${ttl}${ico}`;
    const body=expanded?`<div class="acc-body">${BODY}</div>`:'';

    return `<div class="${cls.join(' ')}"><div class="acc-header">${header}</div>${body}</div>`;
  }

  let h='';
  for(const st of STYLES){
    h+=`<div class="section-lbl">${st.name}</div><div class="style-section">`;

    // Icon Right — Default
    h+=`<div class="sub-lbl">Icon Right · Default</div><div class="size-grid">`;
    for(const sz of SIZES){
      h+=`<div class="size-col"><div class="size-lbl">${sz.name}</div>`;
      h+=`<div class="state-lbl">Collapsed</div>${acc(st.cls,sz.cls,'right',false,false)}`;
      h+=`<div class="state-lbl">Expanded</div>${acc(st.cls,sz.cls,'right',true,false)}`;
      h+=`</div>`;
    }
    h+=`</div>`;

    // Icon Left — Default
    h+=`<div class="sub-lbl">Icon Left · Default</div><div class="size-grid">`;
    for(const sz of SIZES){
      h+=`<div class="size-col"><div class="size-lbl">${sz.name}</div>`;
      h+=`<div class="state-lbl">Collapsed</div>${acc(st.cls,sz.cls,'left',false,false)}`;
      h+=`<div class="state-lbl">Expanded</div>${acc(st.cls,sz.cls,'left',true,false)}`;
      h+=`</div>`;
    }
    h+=`</div>`;

    // Disabled
    h+=`<div class="sub-lbl">Disabled</div><div class="size-grid">`;
    for(const sz of SIZES){
      h+=`<div class="size-col"><div class="size-lbl">${sz.name}</div>`;
      h+=acc(st.cls,sz.cls,'right',false,true);
      h+=`</div>`;
    }
    h+=`</div>`;

    h+=`</div>`;
  }

  document.getElementById('lightBody').innerHTML=h;
  document.getElementById('darkBody').innerHTML=h;
  lucide.createIcons();
 </script>
</body>
</html>
