<!DOCTYPE html>
<html lang="vi" data-theme="light" data-lang-default="vi" data-langs="vi,ja,en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIXIMAX Design System</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font-sans);background:var(--neutral-100);display:flex;color:var(--text-primary)}

  /* ─── Sidebar ─── */
  .sidebar{width:240px;flex:none;background:var(--surface-card);border-right:1px solid var(--border-default);
    display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden}
  .sidebar::-webkit-scrollbar{width:4px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--neutral-300);border-radius:4px}

  .logo{padding:16px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-subtle)}
  .logo-sq{width:30px;height:30px;display:block;flex:none}
  .logo-sq.dark{display:none}
  [data-theme="dark"] .logo-sq.light{display:none}
  [data-theme="dark"] .logo-sq.dark{display:block}
  .logo-text{font-size:13px;font-weight:700;color:var(--text-primary);letter-spacing:.06em}
  .logo-sub{font-size:10px;color:var(--text-tertiary);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}

  .nav{flex:1;padding:8px 0}
  .group{margin-bottom:2px}
  .group-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 16px;border:none;background:none;
    font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary);
    cursor:pointer;font-family:inherit;text-align:left}
  .group-btn:hover{color:var(--text-primary)}
  .group-btn svg{width:12px;height:12px;transition:transform .15s;flex:none}
  .group-btn.open svg{transform:rotate(90deg)}
  .group-items{display:none;padding:0 0 4px}
  .group.open .group-items{display:block}

  .nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 16px 7px 28px;border:none;background:none;
    font-size:13px;color:var(--text-secondary);cursor:pointer;font-family:inherit;text-align:left;
    border-left:2px solid transparent;transition:all .12s;font-weight:var(--fw-medium)}
  .nav-item:hover{background:var(--surface-sunken);color:var(--text-primary)}
  .nav-item.active{background:var(--gold-50);color:var(--text-brand);border-left-color:var(--brand-gold);font-weight:var(--fw-semibold)}

  .sidebar-footer{padding:12px 16px;border-top:1px solid var(--border-subtle);font-size:11px;color:var(--text-disabled);text-align:center}

  /* ─── Main ─── */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

  .topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface-card);
    border-bottom:1px solid var(--border-default);flex:none}
  .topbar-title{font-size:15px;font-weight:700;color:var(--text-primary)}
  .topbar-sub{font-size:12px;color:var(--text-tertiary);flex:1}
  .topbar-group{font-size:11px;font-weight:600;color:var(--text-tertiary);letter-spacing:.06em;text-transform:uppercase;
    background:var(--surface-sunken);padding:3px 8px;border-radius:4px}
  .topbar-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border-default);background:var(--surface-card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary)}
  .topbar-btn:hover{background:var(--surface-sunken);color:var(--text-primary)}
  .topbar-btn svg{width:16px;height:16px}

  .content{flex:1;overflow:hidden;padding:0;min-height:0}
  .content iframe{width:100%;height:100%;border:none;display:block;background:var(--surface-card)}

  /* ─── Language toggle (trên header) ─── */
  .ds-langtoggle{display:flex;gap:2px;background:var(--surface-sunken);border-radius:999px;padding:2px}
  .ds-langbtn{font-size:11px;font-weight:600;letter-spacing:.02em;padding:5px 10px;border:none;border-radius:999px;
    background:none;color:var(--text-tertiary);cursor:pointer;font-family:inherit;transition:all .12s}
  .ds-langbtn:hover{color:var(--text-secondary)}
  .ds-langbtn.active{background:var(--surface-card);color:var(--text-brand);box-shadow:var(--shadow-sm,0 1px 3px rgba(0,0,0,.12))}

  /* ─── Polish port từ index ─── */
  :root{--font-ui:var(--font-sans)}
  :root[data-lang="vi"]{--font-ui:var(--font-vi)}
  :root[data-lang="ja"]{--font-ui:var(--font-jp)}
  .nav-item,.topbar-title{font-family:var(--font-ui)}
  .sb-num{font-size:9px;font-weight:700;color:var(--text-disabled);margin-right:1px;letter-spacing:.02em;font-variant-numeric:tabular-nums;flex:none}
  .nav-item.active .sb-num{color:var(--brand-gold)}
</style>
</head>
<body>

<!-- ═══ SIDEBAR ═══ -->
<aside class="sidebar">
  <div class="logo">
    <img class="logo-sq light" src="../assets/tiximax-symbol-square-navy.svg" alt="TIXIMAX">
    <img class="logo-sq dark" src="../assets/tiximax-symbol-square-gold.svg" alt="TIXIMAX">
    <div>
      <div class="logo-text">TIXIMAX</div>
      <div class="logo-sub">Design System</div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-footer">TIXIMAX Design System · v1.1</div>
</aside>

<!-- ═══ MAIN ═══ -->
<div class="main">
  <div class="topbar">
    <span class="topbar-group" id="topGroup" data-i18n>—</span>
    <span class="topbar-title" id="topTitle" data-i18n>Design System</span>
    <span class="topbar-sub" id="topSub"></span>
    <div class="ds-langtoggle">
      <button class="ds-langbtn" data-lang="vi">VI</button>
      <button class="ds-langbtn" data-lang="ja">日本語</button>
      <button class="ds-langbtn" data-lang="en">EN</button>
    </div>
    <button class="topbar-btn" onclick="toggleTheme()" title="Toggle light / dark" id="themeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <button class="topbar-btn" onclick="openInNewTab()" title="Open in new tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
  </div>

  <!-- Single card view -->
  <div class="content" id="singleView">
    <iframe id="viewer" src="about:blank"></iframe>
  </div>
</div>

<script>
const GROUPS_I18N = {
  Brand:      { ja: 'ブランド',       vi: 'Thương hiệu' },
  Colors:     { ja: 'カラー',         vi: 'Màu sắc' },
  Type:       { ja: 'タイポグラフィ', vi: 'Kiểu chữ' },
  Spacing:    { ja: 'スペーシング',   vi: 'Khoảng cách' },
  Components: { ja: 'コンポーネント', vi: 'Thành phần' },
  Templates:  { ja: 'テンプレート',   vi: 'Mẫu tài liệu' },
};

const CARDS = [
  // Brand
  { group: 'Brand', name: 'Logo', ja: 'ロゴ', vi: 'Logo', sub: 'TIXIMAX · Indonesia · Philippines', file: 'brand-logo.html', h: 720 },
  { group: 'Brand', name: 'Favicon', ja: 'ファビコン', vi: 'Favicon', sub: 'App icon / favicon', file: 'brand-favicon.html', h: 320 },
  // Colors
  { group: 'Colors', name: 'Brand colors', ja: 'ブランドカラー', vi: 'Màu thương hiệu', sub: 'Core + Yellow ramp + Neutral', file: 'colors-brand.html', h: 520 },
  { group: 'Colors', name: 'Semantic colors', ja: 'セマンティックカラー', vi: 'Màu ngữ nghĩa', sub: 'Success, Warning, Error, Info', file: 'colors-semantic.html', h: 220 },
  { group: 'Colors', name: 'Text colors', ja: 'テキストカラー', vi: 'Màu chữ', sub: 'Hierarchy, Brand, Status', file: 'colors-text.html', h: 660 },
  // Type — gộp Montserrat/Inter/Noto thành 1 Typography kiểu index
  { group: 'Type', name: 'Typography', ja: 'タイポグラフィ', vi: 'Kiểu chữ', sub: 'Type scale · Montserrat / Inter / Noto · đa ngữ', file: 'typography.html', h: 900 },
  // Spacing
  { group: 'Spacing', name: 'Spacing scale', ja: 'スペーシング', vi: 'Thang khoảng cách', sub: '4px base scale', file: 'spacing-scale.html', h: 300 },
  { group: 'Spacing', name: 'Corner radius', ja: '角丸', vi: 'Bo góc', sub: 'xs 4px → pill', file: 'radius.html', h: 160 },
  { group: 'Spacing', name: 'Shadow & elevation', ja: 'シャドウ・エレベーション', vi: 'Đổ bóng', sub: 'xs → xl + gold glow', file: 'shadow.html', h: 160 },
  // Components
  { group: 'Components', name: 'Buttons', ja: 'ボタン', vi: 'Nút', sub: '3 sizes × 6 variants × 3 types', file: 'comp-buttons.html', h: 750 },
  { group: 'Components', name: 'Input fields', ja: '入力フィールド', vi: 'Ô nhập', sub: 'Text, icon, date, time, select, validation', file: 'comp-inputs.html', h: 440 },
  { group: 'Components', name: 'Controls', ja: 'コントロール', vi: 'Điều khiển', sub: 'Checkbox, radio, toggle', file: 'comp-controls.html', h: 180 },
  { group: 'Components', name: 'Badges & chips', ja: 'バッジ・チップ', vi: 'Nhãn & chip', sub: 'Status badges + filter chips', file: 'comp-badges.html', h: 310 },
  { group: 'Components', name: 'Alerts', ja: 'アラート', vi: 'Cảnh báo', sub: 'Success, warning, error, info', file: 'comp-alerts.html', h: 250 },
  { group: 'Components', name: 'Card', ja: 'カード', vi: 'Thẻ', sub: 'Service & Order cards', file: 'comp-card.html', h: 400 },
  { group: 'Components', name: 'Table', ja: 'テーブル', vi: 'Bảng', sub: 'Cell types & row states', file: 'comp-table.html', h: 500 },
  { group: 'Components', name: 'List', ja: 'リスト', vi: 'Danh sách', sub: 'Order list rows', file: 'comp-list.html', h: 230 },
  { group: 'Components', name: 'Modal', ja: 'モーダル', vi: 'Hộp thoại', sub: 'Info · Error · Success · Warning', file: 'comp-modal.html', h: 560 },
  { group: 'Components', name: 'Popup & menu', ja: 'ポップアップ・メニュー', vi: 'Popup & menu', sub: 'Dropdown menu + dialog', file: 'comp-popup.html', h: 260 },
  { group: 'Components', name: 'Dropdown', ja: 'ドロップダウン', vi: 'Dropdown', sub: 'Placement: Top/Bottom × Left/Right', file: 'comp-dropdown.html', h: 700 },
  { group: 'Components', name: 'Menu', ja: 'メニュー', vi: 'Menu', sub: 'Horizontal · Vertical · Collapsed', file: 'comp-menu.html', h: 560 },
  { group: 'Components', name: 'Drawer', ja: 'ドロワー', vi: 'Ngăn kéo', sub: 'Right · Left · Top · Bottom', file: 'comp-drawer.html', h: 500 },
  { group: 'Components', name: 'Breadcrumb', ja: 'パンくず', vi: 'Breadcrumb', sub: 'Chevron & slash separators', file: 'comp-breadcrumb.html', h: 300 },
  { group: 'Components', name: 'Anchor', ja: 'アンカー', vi: 'Anchor', sub: 'Vertical + Horizontal', file: 'comp-anchor.html', h: 420 },
  { group: 'Components', name: 'Avatar', ja: 'アバター', vi: 'Avatar', sub: 'Image + Fallback · 28/32/40px', file: 'comp-avatar.html', h: 420 },
  { group: 'Components', name: 'Collapse (Accordion)', ja: 'アコーディオン', vi: 'Thu gọn', sub: 'Basic · Borderless · Ghost', file: 'comp-collapse.html', h: 500 },
  { group: 'Components', name: 'Date picker', ja: '日付ピッカー', vi: 'Chọn ngày', sub: 'Trigger + calendar + range', file: 'comp-datepicker.html', h: 600 },
  { group: 'Components', name: 'Progress', ja: 'プログレス', vi: 'Tiến trình', sub: 'Basic, Steps, Timeline, Curved, Vertical', file: 'comp-progress.html', h: 400 },
  // Templates
  { group: 'Templates', name: 'Slide Deck', ja: 'スライドデッキ', vi: 'Bộ slide', sub: '16:9 · 1920×1080 · Cover / Section', file: 'template-slides.html', h: 620 },
  { group: 'Templates', name: 'Documents', ja: 'ドキュメント', vi: 'Tài liệu', sub: 'A4 · Letter / Invoice', file: 'template-docs.html', h: 760 },
];

// ─── Build sidebar nav ───
const groups = [...new Set(CARDS.map(c => c.group))];
const navEl = document.getElementById('nav');
let navHTML = '', navNum = 0;
groups.forEach(g => {
  const items = CARDS.filter(c => c.group === g);
  const gi = GROUPS_I18N[g] || {};
  navHTML += `<div class="group open" data-group="${g}">
    <button class="group-btn open" onclick="toggleGroup(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span data-i18n data-en="${g}" data-ja="${gi.ja || g}" data-vi="${gi.vi || g}">${g}</span> <span style="opacity:.5;margin-left:auto;font-size:10px;letter-spacing:0">${items.length}</span>
    </button>
    <div class="group-items">
      ${items.map((c) => { const n = String(++navNum).padStart(2, '0'); return `<button class="nav-item" data-file="${c.file}" onclick="selectCard('${c.file}')"><span class="sb-num">${n}</span><span data-i18n data-en="${c.name}" data-ja="${c.ja || c.name}" data-vi="${c.vi || c.name}">${c.name}</span></button>`; }).join('')}
    </div>
  </div>`;
});
navEl.innerHTML = navHTML;

function toggleGroup(btn) {
  const group = btn.closest('.group');
  group.classList.toggle('open');
  btn.classList.toggle('open');
}

// ─── Select card ───
let currentFile = null;
function selectCard(file) {
  currentFile = file;
  const card = CARDS.find(c => c.file === file);
  if (!card) return;

  // Update sidebar active
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.file === file);
  });

  // Update topbar (đa ngôn ngữ: set data-en/ja/vi rồi applyLang localize theo lang hiện tại)
  const gi = GROUPS_I18N[card.group] || {};
  const gEl = document.getElementById('topGroup'), tEl = document.getElementById('topTitle');
  gEl.dataset.en = card.group; gEl.dataset.ja = gi.ja || card.group; gEl.dataset.vi = gi.vi || card.group;
  tEl.dataset.en = card.name;  tEl.dataset.ja = card.ja || card.name; tEl.dataset.vi = card.vi || card.name;
  document.getElementById('topSub').textContent = card.sub;
  applyLang(lang);

  // Load iframe (fills entire content area)
  const viewer = document.getElementById('viewer');
  viewer.src = file;
}

function openInNewTab() {
  if (currentFile) window.open(currentFile, '_blank');
}

// ─── Dark / light theme (localStorage key ds-theme, shared with the deck/showcase) ───
let theme = localStorage.getItem('ds-theme') || 'light';
function setThemeOn(root, t) {
  // colors_and_type.css uses `.dark, [data-theme="dark"]`; some components use `.dark` internally.
  // Set BOTH so foundation + component-local dark rules all fire.
  root.setAttribute('data-theme', t);
  root.classList.toggle('dark', t === 'dark');
}
function applyTheme(t) {
  theme = t;
  setThemeOn(document.documentElement, t);                         // parent shell (sidebar/topbar)
  localStorage.setItem('ds-theme', t);
  const ic = document.getElementById('theme-icon'), lb = document.getElementById('theme-label');
  if (ic) ic.textContent = t === 'dark' ? '☀️' : '🌙';
  if (lb) lb.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
  applyThemeToIframe();
}
function applyThemeToIframe() {
  // Component pages render in an iframe with their own document → theme THAT root.
  try {
    const doc = document.getElementById('viewer').contentDocument;
    if (doc && doc.documentElement) setThemeOn(doc.documentElement, theme);
  } catch (e) { /* cross-origin guard — same-origin in practice */ }
}
function toggleTheme() { applyTheme(theme === 'dark' ? 'light' : 'dark'); }

// ─── Language (localStorage ds-lang; port từ showcase.js) ───
const LANGS = (document.documentElement.getAttribute('data-langs') || 'en').split(',');
const LANG_DEFAULT = document.documentElement.getAttribute('data-lang-default') || LANGS[0] || 'en';
let lang = (() => { try { return localStorage.getItem('ds-lang') || LANG_DEFAULT; } catch { return LANG_DEFAULT; } })();
function applyLang(l) {
  if (!LANGS.includes(l)) l = LANGS[0];
  lang = l;
  document.documentElement.setAttribute('data-lang', l);
  try { localStorage.setItem('ds-lang', l); } catch {}
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const t = el.dataset[l] ?? el.dataset.en ?? el.textContent;
    if (t != null) el.textContent = t;
  });
  document.querySelectorAll('.ds-langbtn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  applyLangToIframe();
}
function setLang(l) { applyLang(l); }
function applyLangToIframe() {
  // Đưa ngôn ngữ vào iframe: set data-lang + gọi applyLang của specimen (nếu include showcase.js)
  try {
    const f = document.getElementById('viewer');
    if (f.contentDocument?.documentElement) f.contentDocument.documentElement.setAttribute('data-lang', lang);
    if (typeof f.contentWindow?.applyLang === 'function') f.contentWindow.applyLang(lang);
  } catch (e) { /* cross-origin guard */ }
}
document.querySelectorAll('.ds-langbtn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

// Re-apply theme + lang whenever a new component loads into the iframe
document.getElementById('viewer').addEventListener('load', () => { applyThemeToIframe(); applyLangToIframe(); });

// ─── Init: theme + lang + first card ───
applyTheme(theme);
applyLang(lang);
selectCard(CARDS[0].file);
</script>
</body>
</html>
